<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Cat Em Ups — Keep Every Cat Flying</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #070510; touch-action: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #game { display: block; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }
  #hint {
    position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%);
    color: rgba(255,255,255,.5); font-size: 12px; letter-spacing: .04em;
    pointer-events: none; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,.7); user-select: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hint">TAP a fan to spin it up · keep every cat flying · P pause</div>
<script src="./awsm-lb.js"></script>
<script>
(() => {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, DPR = 1, appRotated = false;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const portrait = window.innerHeight > window.innerWidth;
    appRotated = portrait;
    W = portrait ? window.innerHeight : window.innerWidth;
    H = portrait ? window.innerWidth  : window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    if (portrait) {
      canvas.style.transformOrigin = "top left";
      canvas.style.transform = "translateX(" + window.innerWidth + "px) rotate(90deg)";
    } else {
      canvas.style.transform = "none";
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 120));
  resize();

  function toCanvas(cx, cy) {
    if (appRotated) return { x: cy, y: window.innerWidth - cx };
    return { x: cx, y: cy };
  }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rnd = (a, b) => a + Math.random() * (b - a);

  // ---------------------------------------------------------------------------
  // Audio — fan hum + whooshes + synthesized meows
  // ---------------------------------------------------------------------------
  let actx = null, master = null, muted = false, humGain = null;
  function ensureAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
    if (actx && !master) {
      master = actx.createGain(); master.gain.value = 0.9; master.connect(actx.destination);
      // looping wind-noise bed for the fans; its volume tracks total fan power
      try {
        const dur = 1.2, buf = actx.createBuffer(1, Math.floor(actx.sampleRate * dur), actx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
        const lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 320; lp.Q.value = 0.6;
        humGain = actx.createGain(); humGain.gain.value = 0;
        src.connect(lp).connect(humGain).connect(master); src.start();
      } catch (e) { humGain = null; }
    }
    if (actx && actx.state === "suspended") actx.resume();
  }
  function blip(freq, dur = 0.08, type = "square", vol = 0.05) {
    if (muted || !actx) return;
    try {
      const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function whoosh() {
    if (muted || !actx) return;
    try {
      const t = actx.currentTime, dur = 0.30;
      const buf = actx.createBuffer(1, Math.floor(actx.sampleRate * dur), actx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.sin((i / d.length) * Math.PI);
      const n = actx.createBufferSource(); n.buffer = buf;
      const bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.2;
      bp.frequency.setValueAtTime(320, t); bp.frequency.exponentialRampToValueAtTime(1500, t + dur);
      const g = actx.createGain(); g.gain.value = 0.16;
      n.connect(bp).connect(g).connect(master); n.start(t);
    } catch (e) {}
  }
  function meow(vol = 0.07, worried = false) {
    if (muted || !actx) return;
    try {
      const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(worried ? 620 : 520, t);
      o.frequency.linearRampToValueAtTime(worried ? 980 : 860, t + 0.12);
      o.frequency.linearRampToValueAtTime(360, t + 0.38);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
      o.connect(g).connect(master); o.start(t); o.stop(t + 0.46);
    } catch (e) {}
  }
  function fallCry() {  // long descending yowl for a dropped cat
    if (muted || !actx) return;
    try {
      const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
      o.type = "square";
      o.frequency.setValueAtTime(520, t);
      o.frequency.exponentialRampToValueAtTime(110, t + 0.55);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.06, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      o.connect(g).connect(master); o.start(t); o.stop(t + 0.62);
    } catch (e) {}
  }
  function thud() {
    if (muted || !actx) return;
    try {
      const t = actx.currentTime, dur = 0.09;
      const buf = actx.createBuffer(1, Math.floor(actx.sampleRate * dur), actx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
      const n = actx.createBufferSource(); n.buffer = buf;
      const lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 240;
      const g = actx.createGain(); g.gain.value = 0.2;
      n.connect(lp).connect(g).connect(master); n.start(t);
    } catch (e) {}
  }
  function chirp() { blip(660, 0.07, "triangle", 0.06); setTimeout(() => blip(990, 0.09, "triangle", 0.06), 70); }

  // ---------------------------------------------------------------------------
  // Cat sprite — spread-eagle skydiver pose, seen from the front (belly-cam!)
  // ---------------------------------------------------------------------------
  const CAT_ROWS = [
    "...ff.......ff...",
    "...fdf.....fdf...",
    "...fffffffffff...",
    "...feefffffeef...",
    "...ffffwpwffff...",
    "...fffwwwwwfff...",
    "....fffffffff....",
    "ff...fffffff...ff",
    ".ff.fffffffff.ff.",
    "..ffdfffffffdff..",
    ".ff.fffffffff.ff.",
    "ff...fffffff...ff",
    "......ffff.......",
    ".........fff.....",
  ];
  const CAT_W = 17, CAT_H = 14;
  const CATS = [
    { f: "#f2a34c", d: "#c9791f", w: "#ffe9c9", p: "#ff8fab", e: "#3fe06d" }, // ginger
    { f: "#a7b2c4", d: "#7d8798", w: "#e8edf5", p: "#ff9fb5", e: "#ffd23f" }, // grey
    { f: "#453f52", d: "#2e2937", w: "#c9c2d8", p: "#ff9fb5", e: "#7ef0ff" }, // black
    { f: "#f5f0e6", d: "#e0a94e", w: "#ffffff", p: "#ff8fab", e: "#57c7ff" }, // calico
    { f: "#8a6242", d: "#6b4a2e", w: "#e8d6c2", p: "#ff9fb5", e: "#9bff57" }, // brown
  ];
  function drawCat(x, y, px, rot, pal, squashY) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot || 0);
    if (squashY && squashY !== 1) ctx.scale(1 / Math.sqrt(squashY), squashY);
    const left = -CAT_W * px / 2, top = -CAT_H * px / 2;
    for (let r = 0; r < CAT_H; r++) {
      const row = CAT_ROWS[r];
      for (let c = 0; c < CAT_W; c++) {
        const ch = row[c]; if (ch === ".") continue;
        ctx.fillStyle = pal[ch] || pal.f;
        ctx.fillRect(left + c * px, top + r * px, px + 0.5, px + 0.5);
      }
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------------
  const SLOT_N = 5;
  const UNLOCK_AT = [0, 12, 30, 55, 85];   // seconds when each fan+cat joins
  let state = "title";                     // title | play | paused | over
  let slots = [], particles = [], popups = [];
  let score = 0, lives = 9, elapsed = 0, submitted = false;
  let best = parseInt(localStorage.getItem("catEmUpsBest") || "0", 10) || 0;

  function newSlot(i) {
    return {
      i, unlockAt: UNLOCK_AT[i], active: false,
      power: 0, cat: null, respawn: 0,
      angle: rnd(0, 6.28), drainMul: rnd(0.9, 1.15),
      boostFlash: 0, meowT: 0,
    };
  }
  function newCat(slot) {
    return {
      state: "fly", pal: CATS[slot.i % CATS.length],
      x: slotX(slot.i), y: fanTopY(), h: 0,           // h = smoothed power (drives height)
      vy: 0, rot: 0, vrot: 0, bob: rnd(0, 6.28),
      squash: 1, runDir: 1,
    };
  }
  function newGame() {
    slots = []; for (let i = 0; i < SLOT_N; i++) slots.push(newSlot(i));
    particles = []; popups = [];
    score = 0; lives = 9; elapsed = 0; submitted = false;
    state = "play";
    ensureAudio();
  }
  function activateSlot(s) {
    s.active = true; s.power = 0.9; s.drainMul = rnd(0.9, 1.15);
    s.cat = newCat(s);
    popup(slotX(s.i), colTopY() + H * 0.1, "NEW CAT!", "#ffd23f");
    chirp();
  }

  // ---- layout helpers (all derived from W/H so resize just works) ----
  function slotW() { return W / SLOT_N; }
  function slotX(i) { return (i + 0.5) * slotW(); }
  function floorY() { return H * 0.9; }
  function fanR() { return Math.min(slotW() * 0.27, H * 0.105); }
  function fanCY() { return floorY() - fanR() - H * 0.012; }
  function fanTopY() { return fanCY() - fanR(); }
  function colTopY() { return H * 0.17; }
  function catPx() { return Math.max(2, Math.round(slotW() * 0.45 / CAT_W)); }
  function catFlyY(powerS) {
    const bottom = fanTopY() - CAT_H * catPx() * 0.55;
    return bottom - powerS * (bottom - colTopY());
  }

  const DANGER = 0.28;
  function drainRate() { return 0.050 + Math.min(0.075, elapsed * 0.00045); }

  // ---------------------------------------------------------------------------
  // Particles & popups
  // ---------------------------------------------------------------------------
  function burst(x, y, n, col) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = rnd(40, 220);
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, life: rnd(0.3, 0.7), age: 0, col, size: rnd(2, 5) });
    }
    if (particles.length > 400) particles.splice(0, particles.length - 400);
  }
  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.age += dt;
      if (p.age >= p.life) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.vx *= 0.99;
    }
  }
  function popup(x, y, txt, col) { popups.push({ x, y, txt, col, age: 0, life: 1.1 }); }
  function updatePopups(dt) {
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i]; p.age += dt; p.y -= H * 0.06 * dt;
      if (p.age >= p.life) popups.splice(i, 1);
    }
  }

  // ---------------------------------------------------------------------------
  // Gameplay
  // ---------------------------------------------------------------------------
  function boost(i) {
    const s = slots[i];
    if (!s || !s.active) return;
    if (!s.cat || s.cat.state !== "fly") { whoosh(); s.boostFlash = 0.35; return; }
    const wasDanger = s.power < DANGER;
    s.power = Math.min(1, s.power + 0.5);
    s.boostFlash = 0.35;
    whoosh();
    if (wasDanger) { score += 25; popup(s.cat.x, s.cat.y - H * 0.06, "SAVE! +25", "#3fe06d"); }
  }

  function dropCat(s) {
    const c = s.cat;
    c.state = "fall";
    c.vy = -H * 0.12;                       // little pop before the plunge
    c.vrot = rnd(2.2, 4) * (Math.random() < 0.5 ? -1 : 1);
    s.power = 0;
    lives--;
    fallCry();
    popup(c.x, c.y, "-1 LIFE", "#ff5f6e");
    if (lives <= 0) {
      state = "over";
      if (score > best) { best = score; localStorage.setItem("catEmUpsBest", String(best)); }
      if (!submitted && window.AWSMLB) { submitted = true; AWSMLB.record("Cat Em Ups", score); }
    }
  }

  function updateCats(dt, time) {
    for (const s of slots) {
      if (!s.active) continue;
      if (s.boostFlash > 0) s.boostFlash = Math.max(0, s.boostFlash - dt);
      // fan blades spin at a rate matching power (or idle slowly)
      s.angle += (2 + s.power * 22) * dt;

      const c = s.cat;
      if (!c) {
        if (state === "play") {
          s.respawn -= dt;
          if (s.respawn <= 0) { s.power = 0.9; s.drainMul = rnd(0.9, 1.15); s.cat = newCat(s); chirp(); }
        }
        continue;
      }
      if (c.state === "fly") {
        c.h += (s.power - c.h) * Math.min(1, dt * 3);
        const wobble = 1 - Math.min(1, s.power / DANGER);   // shakier as the air dies
        c.bob += dt * (2.4 + wobble * 6);
        c.x = slotX(s.i) + Math.sin(c.bob * 0.7) * slotW() * 0.03 * (1 + wobble);
        c.y = catFlyY(c.h) + Math.sin(c.bob) * H * 0.018 * (0.6 + s.power * 0.8);
        c.rot = Math.sin(c.bob * 1.3) * (0.08 + wobble * 0.22);
        c.squash = 1;
        if (s.power < DANGER && state === "play") {
          s.meowT -= dt;
          if (s.meowT <= 0) { s.meowT = 1.3; meow(0.05, true); }
        }
      } else if (c.state === "fall") {
        c.vy += H * 2.2 * dt;
        c.y += c.vy * dt;
        c.rot += c.vrot * dt;
        const groundY = floorY() - CAT_H * catPx() * 0.4;
        if (c.y >= groundY) {                               // cats always land on their feet
          c.y = groundY; c.state = "run"; c.rot = 0; c.squash = 0.55;
          c.runDir = c.x < W / 2 ? -1 : 1;
          burst(c.x, floorY(), 12, "#b9a988");
          thud();
        }
      } else if (c.state === "run") {
        c.squash = Math.min(1, c.squash + dt * 3);
        c.x += c.runDir * W * 0.5 * dt;
        c.y = floorY() - CAT_H * catPx() * 0.4 - Math.abs(Math.sin(time * 18)) * H * 0.012;
        if (c.x < -CAT_W * catPx() || c.x > W + CAT_W * catPx()) {
          s.cat = null; s.respawn = 1.4;
        }
      }
    }
  }

  function update(dt, time) {
    elapsed += dt;
    let aloft = 0;
    for (const s of slots) {
      if (!s.active && elapsed >= s.unlockAt) activateSlot(s);
      if (s.active && s.cat && s.cat.state === "fly") {
        s.power = Math.max(0, s.power - drainRate() * s.drainMul * dt);
        if (s.power <= 0) dropCat(s);
        else aloft++;
      }
    }
    score += aloft * 12 * dt;
    updateCats(dt, time);
    updateParticles(dt);
    updatePopups(dt);
  }

  // ---------------------------------------------------------------------------
  // Drawing
  // ---------------------------------------------------------------------------
  function drawBackground(time) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0b0c26"); g.addColorStop(0.7, "#180d2c"); g.addColorStop(1, "#0d0716");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // faint back-wall panel lines
    ctx.strokeStyle = "rgba(124,132,255,0.07)"; ctx.lineWidth = 1;
    for (let i = 1; i < 5; i++) { const y = H * 0.14 * i; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    // floor
    ctx.fillStyle = "#120a20"; ctx.fillRect(0, floorY(), W, H - floorY());
    ctx.strokeStyle = "rgba(180,107,255,0.4)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, floorY()); ctx.lineTo(W, floorY()); ctx.stroke();
    ctx.strokeStyle = "rgba(124,132,255,0.10)"; ctx.lineWidth = 1;
    for (let i = 0; i <= SLOT_N; i++) { const x = i * slotW(); ctx.beginPath(); ctx.moveTo(x, floorY()); ctx.lineTo(x + (x - W / 2) * 0.1, H); ctx.stroke(); }
  }

  function drawAirColumn(s, time) {
    if (!s.active || !s.cat || s.cat.state !== "fly") return;
    const cx = slotX(s.i), top = s.cat.y + CAT_H * catPx() * 0.3, bottom = fanTopY();
    if (top >= bottom) return;
    let a = 0.10 + s.power * 0.16;
    if (s.power < DANGER) a *= 0.55 + 0.45 * Math.sin(time * 28);   // sputtering flicker
    const colW = fanR() * 1.7;
    const g = ctx.createLinearGradient(0, bottom, 0, top);
    g.addColorStop(0, "rgba(140,220,255," + a.toFixed(3) + ")");
    g.addColorStop(1, "rgba(140,220,255,0)");
    ctx.fillStyle = g;
    ctx.fillRect(cx - colW / 2, top, colW, bottom - top);
    // rising streaks, speed follows power
    ctx.strokeStyle = "rgba(190,235,255," + (a * 2.2).toFixed(3) + ")"; ctx.lineWidth = 2;
    for (let j = 0; j < 5; j++) {
      const xo = ((j - 2) / 2) * colW * 0.36 + Math.sin(time * 2 + j * 2.1) * 3;
      const ph = ((time * (0.5 + s.power * 1.6)) + j * 0.23) % 1;
      const y = bottom - ph * (bottom - top);
      const len = 8 + s.power * 12;
      const fade = Math.sin(ph * Math.PI);
      ctx.globalAlpha = fade;
      ctx.beginPath(); ctx.moveTo(cx + xo, y); ctx.lineTo(cx + xo, y - len); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawFan(s, time) {
    const cx = slotX(s.i), cy = fanCY(), r = fanR();
    const active = s.active;
    // pedestal
    ctx.fillStyle = active ? "#241b3e" : "#171226";
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.55, floorY());
    ctx.lineTo(cx - r * 0.3, cy + r * 0.6);
    ctx.lineTo(cx + r * 0.3, cy + r * 0.6);
    ctx.lineTo(cx + r * 0.55, floorY());
    ctx.closePath(); ctx.fill();
    // housing
    ctx.fillStyle = active ? "#1c1533" : "#141021";
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    // blades
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(s.angle);
    ctx.fillStyle = active ? "rgba(158,178,255,0.85)" : "rgba(120,120,150,0.4)";
    for (let k = 0; k < 3; k++) {
      ctx.rotate(Math.PI * 2 / 3);
      ctx.beginPath(); ctx.ellipse(0, -r * 0.52, r * 0.2, r * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = active ? "#3d3564" : "#221c38";
    ctx.beginPath(); ctx.arc(0, 0, r * 0.18, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // cage
    ctx.strokeStyle = active ? "rgba(200,210,255,0.5)" : "rgba(150,150,180,0.25)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r); ctx.stroke();
    if (!active) return;
    // power ring — the plate-spinning telegraph
    const p = s.power;
    ctx.strokeStyle = "hsl(" + Math.round(p * 120) + ",85%,55%)";
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(cx, cy, r + 5, -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2); ctx.stroke();
    if (s.boostFlash > 0) {
      ctx.globalAlpha = s.boostFlash * 2;
      ctx.strokeStyle = "#8cdcff"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx, cy, r + 10 + (0.35 - s.boostFlash) * 40, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  function drawSlotCat(s, time) {
    const c = s.cat;
    if (!c) return;
    // shadow on the floor under the cat
    const shw = CAT_W * catPx() * (c.state === "fly" ? 0.35 + 0.2 * (1 - c.h) : 0.5);
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath(); ctx.ellipse(c.x, floorY() + 4, shw, 4, 0, 0, Math.PI * 2); ctx.fill();
    drawCat(c.x, c.y, catPx(), c.rot, c.pal, c.squash);
    // worry mark when the air is dying
    if (c.state === "fly" && s.power < DANGER && state === "play") {
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(time * 14);
      ctx.fillStyle = "#ff5f6e"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
      ctx.font = "900 " + Math.round(H * 0.05) + "px -apple-system, system-ui, sans-serif";
      ctx.fillText("!", c.x + CAT_W * catPx() * 0.55, c.y - CAT_H * catPx() * 0.5);
      ctx.globalAlpha = 1;
    }
  }

  function drawParticles() {
    for (const p of particles) { ctx.globalAlpha = 1 - p.age / p.life; ctx.fillStyle = p.col; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
    ctx.globalAlpha = 1;
  }
  function drawPopups() {
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    for (const p of popups) {
      ctx.globalAlpha = 1 - Math.pow(p.age / p.life, 2);
      ctx.font = "900 " + Math.round(H * 0.036) + "px -apple-system, system-ui, sans-serif";
      ctx.fillStyle = p.col; ctx.fillText(p.txt, p.x, p.y);
    }
    ctx.globalAlpha = 1; ctx.textAlign = "left";
  }

  function drawHUD() {
    ctx.fillStyle = "rgba(255,255,255,.95)"; ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.font = "800 20px -apple-system, system-ui, sans-serif";
    ctx.fillText(String(Math.floor(score)).padStart(5, "0"), 52, 12);
    ctx.font = "600 12px -apple-system, system-ui, sans-serif"; ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.fillText("BEST " + String(best).padStart(5, "0"), 52, 36);
    // 9 lives, counted with a little cat head
    const px = 2, headW = CAT_W * px;
    ctx.save(); ctx.translate(W - 60, 24);
    for (let r = 0; r < 7; r++) {
      const row = CAT_ROWS[r];
      for (let c2 = 0; c2 < CAT_W; c2++) {
        const ch = row[c2]; if (ch === ".") continue;
        ctx.fillStyle = CATS[0][ch] || CATS[0].f;
        ctx.fillRect((c2 - CAT_W / 2) * px, (r - 4) * px, px + 0.5, px + 0.5);
      }
    }
    ctx.restore();
    ctx.fillStyle = lives <= 3 ? "#ff5f6e" : "#fff";
    ctx.font = "800 18px -apple-system, system-ui, sans-serif"; ctx.textBaseline = "middle";
    ctx.fillText("× " + lives, W - 60 + headW / 2 + 6, 24);
    ctx.textBaseline = "alphabetic";
  }

  function drawTitle(time) {
    ctx.textAlign = "center";
    ctx.fillStyle = "#fff"; ctx.font = "900 italic " + Math.round(H * 0.11) + "px 'Arial Black', -apple-system, system-ui, sans-serif";
    ctx.shadowColor = "#ff2e97"; ctx.shadowBlur = 18;
    ctx.fillText("CAT EM UPS", W / 2, H * 0.22);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,.6)"; ctx.font = "600 " + Math.round(H * 0.032) + "px -apple-system, system-ui, sans-serif";
    ctx.fillText("PLATE SPINNING, BUT THE PLATES ARE CATS", W / 2, H * 0.31);
    // demo cats bobbing over the edge fans, clear of the text
    const y1 = catFlyY(0.55) + Math.sin(time * 2.4) * H * 0.02;
    const y2 = catFlyY(0.5) + Math.sin(time * 2.1 + 2) * H * 0.02;
    drawCat(slotX(0), y1, catPx(), Math.sin(time * 1.8) * 0.1, CATS[0], 1);
    drawCat(slotX(4), y2, catPx(), Math.sin(time * 1.6 + 1) * 0.1, CATS[1], 1);
    ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.font = "500 " + Math.round(H * 0.03) + "px -apple-system, system-ui, sans-serif";
    ctx.fillText("Fans wind down — TAP a fan to blast its cat back up.", W / 2, H * 0.44);
    ctx.fillText("A dropped cat lands on its feet, but costs a life. You have 9.", W / 2, H * 0.49);
    ctx.fillStyle = "#ffd23f"; ctx.font = "700 " + Math.round(H * 0.04) + "px -apple-system, system-ui, sans-serif";
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 300);
    ctx.fillText("TAP TO START", W / 2, H * 0.62);
    ctx.globalAlpha = 1; ctx.textAlign = "left";
  }
  function drawOver() {
    ctx.fillStyle = "rgba(5,6,13,.72)"; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff5f6e"; ctx.font = "900 " + Math.round(H * 0.09) + "px -apple-system, system-ui, sans-serif";
    ctx.fillText("OUT OF LIVES", W / 2, H * 0.34);
    ctx.fillStyle = "#fff"; ctx.font = "700 " + Math.round(H * 0.05) + "px -apple-system, system-ui, sans-serif";
    ctx.fillText("Score " + Math.floor(score) + " · Best " + best, W / 2, H * 0.48);
    ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.font = "500 " + Math.round(H * 0.028) + "px -apple-system, system-ui, sans-serif";
    ctx.fillText("All cats walked away unharmed. Obviously.", W / 2, H * 0.56);
    ctx.fillStyle = "#ffd23f"; ctx.font = "700 " + Math.round(H * 0.036) + "px -apple-system, system-ui, sans-serif";
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 300);
    ctx.fillText("TAP TO TRY AGAIN", W / 2, H * 0.68);
    ctx.globalAlpha = 1; ctx.textAlign = "left";
  }
  function drawPause() {
    ctx.fillStyle = "rgba(5,6,13,.6)"; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center"; ctx.fillStyle = "#fff"; ctx.font = "800 " + Math.round(H * 0.07) + "px -apple-system, system-ui, sans-serif";
    ctx.fillText("PAUSED", W / 2, H / 2); ctx.textAlign = "left";
  }

  // ---------------------------------------------------------------------------
  // Input
  // ---------------------------------------------------------------------------
  function pressAt(x, y) {
    if (state === "title") { newGame(); return; }
    if (state === "over") { newGame(); return; }
    if (state === "paused") { state = "play"; return; }
    if (state !== "play") return;
    boost(clamp(Math.floor(x / slotW()), 0, SLOT_N - 1));
  }
  canvas.addEventListener("mousedown", (e) => { const p = toCanvas(e.clientX, e.clientY); ensureAudio(); pressAt(p.x, p.y); });
  canvas.addEventListener("touchstart", (e) => {
    e.preventDefault(); ensureAudio();
    for (const t of e.changedTouches) { const p = toCanvas(t.clientX, t.clientY); pressAt(p.x, p.y); }
  }, { passive: false });
  window.addEventListener("keydown", (e) => {
    if (document.activeElement && document.activeElement.tagName === "INPUT") return;   // initials entry
    const k = e.key.toLowerCase();
    if (k === " ") { e.preventDefault(); pressAt(W / 2, H / 2); }
    else if (k >= "1" && k <= "5") { ensureAudio(); if (state === "play") boost(parseInt(k, 10) - 1); }
    else if (k === "p") { if (state === "play") state = "paused"; else if (state === "paused") state = "play"; }
    else if (k === "m") { muted = !muted; if (!muted) ensureAudio(); }
  }, { passive: false });

  // ---------------------------------------------------------------------------
  // Loop
  // ---------------------------------------------------------------------------
  // give the title screen its fans
  slots = []; for (let i = 0; i < SLOT_N; i++) { const s = newSlot(i); s.active = (i === 0 || i === 2 || i === 4); s.power = 0.75; slots.push(s); }

  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000; last = now; if (dt > 0.05) dt = 0.05;
    const time = now / 1000;

    if (state === "play") update(dt, time);
    else { for (const s of slots) s.angle += (2 + s.power * 22) * dt; updateCats(0, time); updateParticles(dt); updatePopups(dt); }
    if (state === "over") { updateCats(dt, time); }   // let a mid-air cat finish falling

    // fan hum level follows total wind
    if (humGain && actx) {
      let target = 0;
      if ((state === "play" || state === "paused") && !muted) {
        let sum = 0, n2 = 0; for (const s of slots) if (s.active) { sum += s.power; n2++; }
        target = 0.015 + (n2 ? (sum / n2) : 0) * 0.05 + n2 * 0.004;
      }
      humGain.gain.value += (target - humGain.gain.value) * 0.08;
    }

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawBackground(time);
    for (const s of slots) drawAirColumn(s, time);
    for (const s of slots) drawFan(s, time);
    for (const s of slots) drawSlotCat(s, time);
    drawParticles();
    drawPopups();
    if (state === "title") drawTitle(time);
    else {
      drawHUD();
      if (state === "paused") drawPause();
      if (state === "over") drawOver();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
<!-- Quit to arcade -->
<button id="quitBtn" type="button" aria-label="Quit to arcade" title="Quit">✕</button>
<style>
  #quitBtn{ position:fixed; z-index:99999; left:10px; top:10px; width:32px; height:32px;
    display:flex; align-items:center; justify-content:center; padding:0; margin:0;
    border:1px solid rgba(255,255,255,.22); border-radius:9px; color:rgba(255,255,255,.85);
    background:rgba(18,18,28,.5); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
    font:700 15px -apple-system, system-ui, sans-serif; line-height:1; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  #quitBtn:hover{ background:rgba(40,40,60,.8); }
  #quitBtn:active{ transform:scale(.94); }
</style>
<script>
(function(){
  var b=document.getElementById('quitBtn'); if(!b) return;
  function stop(e){ e.stopPropagation(); }
  b.addEventListener('mousedown', stop, true);
  b.addEventListener('touchstart', stop, {capture:true, passive:true});
  b.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); location.href='./'; });
})();
</script>
