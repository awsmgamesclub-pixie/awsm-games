<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05050c">
<title>Draw · Will's Intergalactic Tarranium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --space:#05050c; --panel:#0e0e1c; --chip:rgba(255,255,255,.08); --ink:#f4f2ff; --muted:#8b88a8;
  --accent:#c77dff; --line:rgba(255,255,255,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--space);color:var(--ink);
  font-family:Fredoka,system-ui,sans-serif;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.stars{background-color:var(--space);background-image:
  radial-gradient(1px 1px at 12% 18%,#fff8,transparent),radial-gradient(1px 1px at 72% 9%,#fff9,transparent),
  radial-gradient(1.5px 1.5px at 33% 64%,#fff7,transparent),radial-gradient(1px 1px at 88% 52%,#fff8,transparent),
  radial-gradient(1px 1px at 54% 31%,#fff6,transparent),radial-gradient(1.5px 1.5px at 8% 83%,#fff7,transparent),
  radial-gradient(1px 1px at 63% 88%,#fff6,transparent),radial-gradient(1px 1px at 93% 22%,#fff7,transparent),
  radial-gradient(1px 1px at 24% 42%,#fff5,transparent),radial-gradient(1px 1px at 46% 76%,#fff5,transparent);
  background-size:260px 260px}

#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:var(--panel);border-bottom:1px solid var(--line)}
header .brand{font-weight:700;font-size:16px;letter-spacing:.2px;flex:1;min-width:0;line-height:1.1}
header .brand small{display:block;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0;margin-top:2px}
#who{background:var(--chip);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500;
  max-width:42vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
#who::before{content:"✎ ";opacity:.7}

#stage{position:relative;flex:1;min-height:0}
#pad{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hint{position:absolute;left:16px;right:16px;top:16px;text-align:center;font-size:21px;line-height:1.3;color:#c9c6e0;
  pointer-events:none;transition:opacity .3s}
#hint b{color:var(--ink);font-weight:600}

#ring{position:absolute;width:104px;height:104px;margin:-52px 0 0 -52px;pointer-events:none;opacity:0;transition:opacity .15s}
#ring.on{opacity:1}
#ring circle{fill:none;stroke-width:6;stroke-linecap:round}
#ring .bg{stroke:rgba(255,255,255,.12)}
#ring .fg{stroke:var(--accent);stroke-dasharray:289;stroke-dashoffset:289;transform:rotate(-90deg);transform-origin:50% 50%}

#sprite{position:absolute;left:0;top:0;display:none;touch-action:none;transform-origin:50% 50%;
  outline:3px dashed var(--accent);outline-offset:4px;border-radius:10px;
  filter:drop-shadow(0 0 14px rgba(199,125,255,.55));will-change:transform}
#sprite.on{display:block}
#sprite.flying{outline-color:transparent}

#bar{background:var(--panel);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.sw{width:34px;height:34px;border-radius:50%;flex:none;position:relative;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.sw[aria-pressed=true]::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:3px solid var(--ink)}
.sizes{display:flex;gap:6px}
.sz{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--chip)}
.sz[aria-pressed=true]{background:var(--ink)}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz[aria-pressed=true] i{background:var(--space)}
.tools{display:flex;gap:6px}
.tool{height:44px;min-width:44px;padding:0 12px;border-radius:12px;background:var(--chip);font-weight:500;font-size:15px}
.tool:active,.sz:active{transform:scale(.95)}

#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:var(--ink);color:var(--space);padding:10px 16px;border-radius:999px;font-size:15px;font-weight:600;
  opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* name screen */
#namer{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;color:var(--ink);touch-action:auto}
#namer.hide{display:none}
.card{position:relative;width:100%;max-width:380px;text-align:center}
.card h1{font-size:34px;line-height:1.05;margin:0 0 8px;font-weight:700}
.card h1 span{display:block;font-size:.5em;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.card p{margin:0 0 28px;color:#c9c6e0;font-size:20px;line-height:1.3}
.fish{font-size:50px;display:block;margin-bottom:10px;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-8deg)}}
.card label{display:block;text-align:left;font-weight:500;margin:0 0 8px 4px}
#name{width:100%;font:inherit;font-size:20px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);outline:none;
  background:#16162a;color:var(--ink);-webkit-user-select:text;user-select:text}
#name::placeholder{color:var(--muted)}
#name:focus{box-shadow:0 0 0 4px rgba(199,125,255,.45)}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.btn{padding:14px;border-radius:14px;font-size:18px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--space)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.testmode{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Will's Intergalactic Tarranium<small>draw a creature, launch it into space</small></div>
    <button id="who" type="button" aria-label="Change name"></button>
  </header>
  <div id="stage" class="stars">
    <canvas id="pad"></canvas>
    <div id="hint">Draw something with your finger</div>
    <svg id="ring" viewBox="0 0 104 104"><circle class="bg" cx="52" cy="52" r="46"/><circle class="fg" cx="52" cy="52" r="46"/></svg>
    <canvas id="sprite"></canvas>
  </div>
  <div id="bar">
    <div class="row" id="colours"></div>
    <div class="row">
      <div class="sizes" id="sizes"></div>
      <div class="tools">
        <button class="tool" id="undo" type="button" aria-label="Undo">Undo</button>
        <button class="tool" id="wipe" type="button">Clear</button>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<div id="namer" class="stars">
  <form class="card" id="nameForm" autocomplete="off">
    <h1><span>Will's Intergalactic</span>Tarranium</h1>
    <p>Draw a creature, then flick it up into space.</p>
    <label for="name">Who's drawing?</label>
    <input id="name" maxlength="24" placeholder="Your name" enterkeyhint="go">
    <div class="btns">
      <button class="btn primary" type="submit">Let's draw →</button>
      <button class="btn ghost" type="button" id="needName">🎲&nbsp; I need a name</button>
    </div>
  </form>
  <div class="testmode" id="testmode" hidden>test mode · not connected to the Tarranium yet</div>
</div>

<script src="terra.js?v=3"></script>
<script>
(() => {
const COLOURS = ['#ffffff', '#ff4b4b', '#ff9f1c', '#ffd60a', '#2bd96b', '#2f80ff', '#9b5de5', '#ff5fa2'];
const SIZES = [4, 9, 16, 26];
const HOLD_MS = 1000, RING_DELAY = 180, MOVE_TOL = 12;

const $ = id => document.getElementById(id);
const pad = $('pad'), ctx = pad.getContext('2d'), stage = $('stage');
const sprite = $('sprite'), sctx = sprite.getContext('2d');
const ring = $('ring'), ringFg = ring.querySelector('.fg'), hint = $('hint');

let colour = COLOURS[0], size = SIZES[1];
let strokes = [];        // {c, w, p:[x,y,...]} in stage px
let lastWiped = null;    // so Undo can restore a Clear
let name = '';
let W = 0, H = 0, DPR = 1;

/* ---------- naming ---------- */
const ADJ = ['Wobbly','Sparkly','Grumpy','Sleepy','Zippy','Bouncy','Fuzzy','Cosmic','Soggy','Giggly','Sneaky','Dizzy',
  'Jolly','Tiny','Mighty','Wiggly','Snoozy','Peppy','Breezy','Crunchy','Squishy','Glittery','Brave','Bashful','Turbo','Velvet'];
const ANI = ['Newt','Axolotl','Pufferfish','Seahorse','Octopus','Jellyfish','Shrimp','Turtle','Starfish','Guppy','Tadpole',
  'Squid','Narwhal','Crab','Otter','Gecko','Snail','Manatee','Eel','Lobster','Clownfish','Walrus','Frog','Beluga'];
const pick = a => a[Math.floor(Math.random() * a.length)];
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

$('name').value = store.get('terra_name') || '';
$('testmode').hidden = !Terra.local;
$('needName').onclick = () => { $('name').value = pick(ADJ) + ' ' + pick(ANI); };
$('nameForm').onsubmit = e => {
  e.preventDefault();
  name = $('name').value.trim().replace(/\s+/g, ' ').slice(0, 24) || pick(ADJ) + ' ' + pick(ANI);
  store.set('terra_name', name);
  $('who').textContent = name;
  $('name').blur();
  $('namer').classList.add('hide');
  resize();
};
$('who').onclick = () => { $('namer').classList.remove('hide'); };

/* ---------- toolbar ---------- */
const colourRow = $('colours'), sizeRow = $('sizes');
COLOURS.forEach(c => {
  const b = document.createElement('button');
  b.className = 'sw'; b.type = 'button'; b.style.background = c; b.setAttribute('aria-label', 'Colour ' + c);
  b.onclick = () => { colour = c; syncBar(); };
  colourRow.appendChild(b);
});
SIZES.forEach(s => {
  const b = document.createElement('button');
  b.className = 'sz'; b.type = 'button'; b.setAttribute('aria-label', 'Pen size ' + s);
  const i = document.createElement('i'); const d = Math.min(s, 26); i.style.width = i.style.height = d + 'px';
  b.appendChild(i);
  b.onclick = () => { size = s; syncBar(); };
  sizeRow.appendChild(b);
});
function syncBar() {
  [...colourRow.children].forEach((b, i) => b.setAttribute('aria-pressed', COLOURS[i] === colour));
  [...sizeRow.children].forEach((b, i) => b.setAttribute('aria-pressed', SIZES[i] === size));
}
syncBar();
$('undo').onclick = () => {
  if (held) putDown();
  if (strokes.length) strokes.pop();
  else if (lastWiped) { strokes = lastWiped; lastWiped = null; }
  redraw();
};
$('wipe').onclick = () => {
  if (held) putDown();
  if (strokes.length) { lastWiped = strokes; strokes = []; redraw(); }
};

/* ---------- canvas ---------- */
function resize() {
  const r = stage.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = r.width; H = r.height;
  pad.width = Math.round(W * DPR); pad.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  redraw();
}
addEventListener('resize', resize);

function redraw() {
  ctx.clearRect(0, 0, W, H);
  if (!held) for (const s of strokes) Terra.drawStroke(ctx, s, s.p);
  setHint();
}
function setHint() {
  if (held) hint.innerHTML = '<b>Flick it up</b> to launch it into space';
  else if (strokes.length) hint.innerHTML = 'Done? <b>Hold your finger on it</b> to pick it up';
  else hint.innerHTML = 'Draw something with your finger';
}

function bbox(list) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, wmax = 0;
  for (const s of list) {
    wmax = Math.max(wmax, s.w);
    for (let i = 0; i < s.p.length; i += 2) {
      const x = s.p[i], y = s.p[i + 1];
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
  }
  if (x0 === Infinity) return null;
  const pad = wmax / 2 + 4;
  return { x0: x0 - pad, y0: y0 - pad, x1: x1 + pad, y1: y1 + pad };
}

const local = e => { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

/* ---------- drawing + hold-to-grab ---------- */
let press = null;   // active pointer on the pad
let held = null;    // {x, y, w, h, ox0, oy0} sprite position in stage px when lifted

pad.addEventListener('pointerdown', e => {
  if (press) return;                       // one finger at a time
  if (held) { putDown(); }                 // tapping off the lifted drawing drops it back
  try { pad.setPointerCapture(e.pointerId); } catch (err) {}
  const p = local(e);
  const bb = bbox(strokes);
  const onInk = bb && p.x > bb.x0 - 20 && p.x < bb.x1 + 20 && p.y > bb.y0 - 20 && p.y < bb.y1 + 20;
  const stroke = { c: colour, w: size, p: [p.x, p.y] };
  strokes.push(stroke);
  press = { id: e.pointerId, x0: p.x, y0: p.y, t0: performance.now(), stroke, onInk, timer: 0, raf: 0 };
  redraw();
  if (onInk) {
    press.timer = setTimeout(() => grab(p), HOLD_MS);
    const tick = () => {
      if (!press || !press.timer) return;
      const t = performance.now() - press.t0;
      if (t > RING_DELAY) {
        ring.classList.add('on');
        ring.style.left = press.x0 + 'px'; ring.style.top = press.y0 + 'px';
        ringFg.style.strokeDashoffset = 289 * (1 - Math.min(1, (t - RING_DELAY) / (HOLD_MS - RING_DELAY)));
      }
      press.raf = requestAnimationFrame(tick);
    };
    press.raf = requestAnimationFrame(tick);
  }
});

pad.addEventListener('pointermove', e => {
  if (!press || e.pointerId !== press.id) return;
  if (dragging) return dragMove(e);
  let evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  if (!evs.length) evs = [e];
  for (const ev of evs) {
    const p = local(ev), pts = press.stroke.p;
    const lx = pts[pts.length - 2], ly = pts[pts.length - 1];
    if (Math.hypot(p.x - lx, p.y - ly) >= 1.5) pts.push(p.x, p.y);
    if (press.timer && Math.hypot(p.x - press.x0, p.y - press.y0) > MOVE_TOL) cancelHold();
  }
  redraw();
});

const endPress = e => {
  if (!press || e.pointerId !== press.id) return;
  cancelHold();
  if (dragging) { dragEnd(e); press = null; return; }
  press = null;
  redraw();
};
pad.addEventListener('pointerup', endPress);
pad.addEventListener('pointercancel', endPress);

function cancelHold() {
  if (!press) return;
  clearTimeout(press.timer); press.timer = 0;
  cancelAnimationFrame(press.raf);
  ring.classList.remove('on');
}

function grab(p) {
  if (!press) return;
  cancelHold();
  strokes.pop();                           // the "press" dot wasn't meant to be ink
  if (!strokes.length) return;
  lift();
  navigator.vibrate && navigator.vibrate(25);
  startDrag(p);                            // keep dragging with the same finger
}

/* ---------- lifted sprite ---------- */
function lift() {
  const bb = bbox(strokes);
  const w = bb.x1 - bb.x0, h = bb.y1 - bb.y0;
  sprite.width = Math.round(w * DPR); sprite.height = Math.round(h * DPR);
  sprite.style.width = w + 'px'; sprite.style.height = h + 'px';
  sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  sctx.clearRect(0, 0, w, h);
  for (const s of strokes) Terra.drawStroke(sctx, s, s.p, 1, -bb.x0, -bb.y0);
  held = { x: bb.x0, y: bb.y0, w, h, ox0: bb.x0, oy0: bb.y0, rot: 0, scale: 1.05 };
  sprite.className = 'on';
  placeSprite();
  redraw();
}
function placeSprite() {
  sprite.style.transform = `translate(${held.x}px,${held.y}px) rotate(${held.rot}rad) scale(${held.scale})`;
}
function putDown() {
  if (!held) return;
  const dx = held.x - held.ox0, dy = held.y - held.oy0;
  for (const s of strokes) for (let i = 0; i < s.p.length; i += 2) { s.p[i] += dx; s.p[i + 1] += dy; }
  held = null; sprite.className = '';
  redraw();
}

let dragging = false, grabOff = null, samples = [];
function startDrag(p) {
  dragging = true;
  grabOff = { x: p.x - held.x, y: p.y - held.y };
  samples = [{ x: p.x, y: p.y, t: performance.now() }];
}
function dragMove(e) {
  const p = local(e);
  held.x = p.x - grabOff.x; held.y = p.y - grabOff.y;
  const t = performance.now();
  samples.push({ x: p.x, y: p.y, t });
  while (samples.length > 2 && t - samples[0].t > 90) samples.shift();
  placeSprite();
}
function dragEnd(e) {
  dragging = false;
  const a = samples[0], b = samples[samples.length - 1];
  const dt = Math.max(1, b.t - a.t);
  const vx = (b.x - a.x) / dt, vy = (b.y - a.y) / dt;  // px per ms
  if (vy < -0.55 && Math.abs(vx) < Math.abs(vy) * 1.6) fling(vx, vy);
  else setHint();
}

// re-grab a lifted drawing that was let go without a flick
sprite.addEventListener('pointerdown', e => {
  if (!held || sprite.classList.contains('flying') || press) return;
  e.stopPropagation();
  try { sprite.setPointerCapture(e.pointerId); } catch (err) {}
  press = { id: e.pointerId, timer: 0 };
  startDrag(local(e));
});
sprite.addEventListener('pointermove', e => { if (press && e.pointerId === press.id && dragging) dragMove(e); });
const spriteUp = e => { if (press && e.pointerId === press.id) { if (dragging) dragEnd(e); press = null; } };
sprite.addEventListener('pointerup', spriteUp);
sprite.addEventListener('pointercancel', spriteUp);

/* ---------- send ---------- */
function payload() {
  const bb = bbox(strokes);
  const r = n => Math.round(n);
  return {
    n: name,
    w: r(bb.x1 - bb.x0), h: r(bb.y1 - bb.y0), vw: r(W),
    s: strokes.map(s => {
      const out = [];
      for (let i = 0; i < s.p.length; i += 2) out.push(r(s.p[i] - bb.x0), r(s.p[i + 1] - bb.y0));
      return { c: s.c, w: s.w, p: out.join(',') };
    }),
  };
}

function fling(vx, vy) {
  const data = payload();
  const sent = Terra.send(data);
  sprite.classList.add('flying');
  let x = held.x, y = held.y, rot = 0, last = performance.now();
  vy = Math.min(vy, -1.1);                   // make sure it really leaves
  const spin = vx * 0.004;
  const step = now => {
    const dt = Math.min(40, now - last); last = now;
    vy *= 1.0 + dt * 0.002; x += vx * dt; y += vy * dt; rot += spin * dt;
    held.x = x; held.y = y; held.rot = rot; held.scale = Math.max(0.6, held.scale - dt * 0.0006);
    placeSprite();
    if (y + held.h * 1.2 > -40) requestAnimationFrame(step);
    else landed();
  };
  requestAnimationFrame(step);

  const backup = strokes;
  strokes = []; lastWiped = null;
  async function landed() {
    held = null; sprite.className = '';
    try {
      await sent;
      toast('🚀 Launched into Will\'s Intergalactic Tarranium!');
    } catch (err) {
      strokes = backup; redraw();
      toast('Lost signal with the Tarranium. Try again?');
      return;
    }
    redraw();
  }
}

let toastT = 0;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600);
}

// keep iOS from scrolling / zooming the page
document.addEventListener('touchmove', e => { if (!e.target.closest('#namer')) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());

resize();
})();
</script>
</body>
</html>
