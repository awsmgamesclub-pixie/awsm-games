<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>The Salmon Run — Surviving in Style</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #05060d; touch-action: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #game { display: block; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }
  #hint {
    position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%);
    color: rgba(255,255,255,.5); font-size: 12px; letter-spacing: .04em;
    pointer-events: none; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,.7);
    user-select: none; width: 96vw;
  }
  /* This game plays in portrait — nudge the player to turn back if in landscape. */
  #rotate {
    position: fixed; inset: 0; z-index: 60; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: #05060d; text-align: center; padding: 24px; color: #fff;
  }
  #rotate .phone {
    width: 40px; height: 66px; border: 3px solid #fb7185; border-radius: 11px;
    box-shadow: 0 0 16px rgba(251,113,133,.5), inset 0 0 8px rgba(251,113,133,.25);
    animation: salmonrot 2.4s ease-in-out infinite;
  }
  @keyframes salmonrot { 0%,20%{ transform: rotate(-90deg); } 50%,74%{ transform: rotate(0); } 100%{ transform: rotate(-90deg); } }
  #rotate .t1 { color: #fb7185; font-weight: 800; letter-spacing: 2.5px; font-size: 18px; }
  #rotate .t2 { color: rgba(255,255,255,.7); font-size: 13.5px; letter-spacing: 1px; }
  @media (orientation: landscape) and (max-height: 600px){ #rotate{ display: flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hint">drag to swim · tap to leap · tap in air to FLIP — or SLAP a bear · P pause · M mute</div>
<div id="rotate">
  <span class="phone"></span>
  <div class="t1">ROTATE YOUR DEVICE</div>
  <div class="t2">The Salmon Run plays in portrait</div>
</div>
<script src="./awsm-lb.js"></script>
<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------------------
  // Fixed virtual resolution, letterboxed to fit any screen (portrait).
  // ---------------------------------------------------------------------------
  const VW = 600, VH = 900;
  const TAU = Math.PI * 2;

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, DPR = 1, scale = 1, ox = 0, oy = 0;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    scale = Math.min(W / VW, H / VH);
    ox = (W - VW * scale) / 2;
    oy = (H - VH * scale) / 2;
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 120));
  resize();

  function toVirtual(cx, cy) { return { x: (cx - ox) / scale, y: (cy - oy) / scale }; }

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const hash = (n) => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

  // ---------------------------------------------------------------------------
  // Audio — lazy WebAudio bleeps, unlocked on first touch. Sound on by default.
  // ---------------------------------------------------------------------------
  let actx = null, muted = false;
  function ensureAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
    if (actx && actx.state === "suspended") actx.resume();
  }
  function note(freq, dur = 0.12, type = "triangle", vol = 0.07, delay = 0) {
    if (muted || !actx) return;
    try {
      const t = actx.currentTime + delay;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function zip(f0, f1, dur = 0.15, type = "triangle", vol = 0.07) {
    if (muted || !actx) return;
    try {
      const t = actx.currentTime;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function noise(dur = 0.14, vol = 0.14) {
    if (muted || !actx) return;
    try {
      const t = actx.currentTime;
      const buf = actx.createBuffer(1, Math.floor(actx.sampleRate * dur), actx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
      const src = actx.createBufferSource(); src.buffer = buf;
      const g = actx.createGain(); g.gain.value = vol;
      src.connect(g).connect(actx.destination); src.start(t);
    } catch (e) {}
  }
  const sfxJump   = () => zip(330, 660, 0.16, "triangle", 0.07);
  const sfxSplash = () => noise(0.12, 0.10);
  const sfxFlip   = () => zip(880, 1420, 0.12, "sine", 0.05);
  const sfxSlap   = () => { noise(0.16, 0.24); note(1567, 0.2, "triangle", 0.09); note(2093, 0.16, "sine", 0.05, 0.04); };
  const sfxGrind  = () => note(85 + Math.random() * 30, 0.06, "sawtooth", 0.028);
  const sfxHit    = () => zip(220, 70, 0.28, "square", 0.07);
  const sfxNear   = () => note(740, 0.07, "sine", 0.045);
  const sfxYum    = () => { note(1047, 0.08, "sine", 0.05); note(1319, 0.1, "sine", 0.04, 0.06); };
  const sfxBanner = () => { note(523, 0.14, "triangle", 0.06); note(659, 0.14, "triangle", 0.06, 0.12); note(784, 0.22, "triangle", 0.07, 0.24); };
  const sfxWin    = () => { [523, 659, 784, 1047, 1319].forEach((f, i) => note(f, 0.3, "triangle", 0.08, i * 0.15)); note(1568, 0.6, "sine", 0.06, 0.8); };

  // ---------------------------------------------------------------------------
  // The salmon sprite — a spawning sockeye: red body, olive-green head.
  // ---------------------------------------------------------------------------
  const FISH = [
    "....ooo....",
    "...oGGGo...",
    "..oGGGGGo..",
    "..GBGGGBG..",
    "..gGGGGGg..",
    "...gGGGg...",
    "..dRRrRRd..",
    ".FdRrrrRdF.",
    "FF.RrwrR.FF",
    ".F.RrwrR.F.",
    "...RrwrR...",
    "..dRrrrRd..",
    "..dRRrRRd..",
    "...RRRRR...",
    "...dRRRd...",
    "....RRR....",
    "....dRd....",
    "..TT.d.TT..",
    ".TT..T..TT.",
  ];
  const PAL = {
    G: "#3f6212", o: "#4d7c0f", g: "#365314", B: "#0f172a",
    R: "#dc2626", r: "#ef4444", w: "#fb7185", d: "#7f1d1d",
    F: "#d4a29c", T: "#c2410c",
  };
  const FW = 11, FH = FISH.length;

  function drawFish(cx, cy, px, rot, alpha) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    if (alpha !== undefined) ctx.globalAlpha = alpha;
    const x0 = -FW * px / 2, y0 = -FH * px / 2;
    for (let r = 0; r < FH; r++) {
      const row = FISH[r];
      for (let c = 0; c < FW; c++) {
        const ch = row[c];
        if (ch === ".") continue;
        ctx.fillStyle = PAL[ch];
        ctx.fillRect(x0 + c * px, y0 + r * px, px + 0.5, px + 0.5);
      }
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // River geometry — the channel narrows in the headwaters.
  // ---------------------------------------------------------------------------
  function bankBase(wy) { return 92 + 52 * smooth((wy - 18200) / 1200); }
  function edgeL(wy) { return bankBase(wy) + Math.sin(wy * 0.008) * 16 + Math.sin(wy * 0.0023) * 10; }
  function edgeR(wy) { return VW - bankBase(wy) + Math.sin(wy * 0.0075 + 2.6) * 16 + Math.sin(wy * 0.0021 + 1.3) * 10; }

  // ---------------------------------------------------------------------------
  // Zones — a finite journey to the spawning grounds.
  // ---------------------------------------------------------------------------
  const ZONES = [
    { name: "THE ESTUARY",    end: 4600,  scroll: 120, water: [26, 90, 130],  bank: [45, 122, 66]  },
    { name: "RAPID CANYON",   end: 11200, scroll: 140, water: [22, 80, 118],  bank: [40, 110, 58]  },
    { name: "BEAR FALLS",     end: 18000, scroll: 160, water: [17, 68, 104],  bank: [32, 92, 48]   },
    { name: "THE HEADWATERS", end: 22650, scroll: 172, water: [13, 56, 92],   bank: [70, 80, 74]   },
  ];
  const WIN_WY = 22650;
  function zoneOf(wy) { for (let i = 0; i < ZONES.length; i++) if (wy < ZONES[i].end) return i; return ZONES.length - 1; }

  // Hand-crafted spawn chunks. x/x0/x1 are fractions across the channel.
  const rock = (x, r, dy) => ({ t: "rock", x, r, dy });
  const log_ = (x, dy, len, a) => ({ t: "log", x, dy, len, a });
  const fall = (dy, x0, x1) => ({ t: "fall", dy, x0, x1 });
  const rapid = (dy, len) => ({ t: "rapid", dy, len });
  const bear = (s, dy) => ({ t: "bear", s, dy });
  const fly_ = (x, dy) => ({ t: "fly", x, dy });
  const roe_ = (x, dy) => ({ t: "roe", x, dy });

  const CHUNKS = [
    [ // zone 1 — THE ESTUARY: learn to swim, leap, grind
      { len: 820, e: [rock(.28, 22, 180), rock(.72, 26, 430), roe_(.5, 300), roe_(.52, 620)] },
      { len: 800, e: [log_(.5, 300, 210, .12), fly_(.3, 150), fly_(.68, 520), roe_(.5, 650)] },
      { len: 860, e: [rock(.2, 24, 150), rock(.75, 22, 340), rock(.35, 26, 560), roe_(.55, 450), roe_(.5, 700)] },
      { len: 900, e: [roe_(.5, 120), fall(430), fly_(.5, 560), roe_(.5, 700)] },
      { len: 760, e: [roe_(.35, 150), roe_(.5, 300), roe_(.65, 450), fly_(.5, 600)] },
    ],
    [ // zone 2 — RAPID CANYON: rapids, gauntlets, first bears
      { len: 900, e: [rapid(80, 420), rock(.5, 24, 260), roe_(.3, 640), fly_(.7, 700)] },
      { len: 880, e: [fall(420, .12, null), log_(.55, 420, 250, -.08), roe_(.2, 250)] },
      { len: 860, e: [bear("L", 380), rock(.7, 24, 180), roe_(.6, 600), fly_(.5, 520)] },
      { len: 900, e: [rock(.25, 26, 140), rock(.6, 22, 300), rock(.35, 24, 470), fall(700)] },
      { len: 840, e: [rapid(120, 380), fly_(.4, 200), fly_(.6, 360), roe_(.5, 640)] },
      { len: 860, e: [bear("R", 430), rock(.3, 26, 200), roe_(.35, 650)] },
    ],
    [ // zone 3 — BEAR FALLS: the gauntlet
      { len: 900, e: [bear("L", 260), bear("R", 560), roe_(.5, 410)] },
      { len: 940, e: [fall(320), log_(.5, 450, 240, .1), fall(600), roe_(.5, 780)] },
      { len: 920, e: [log_(.35, 220, 260, .18), fall(380), log_(.65, 540, 260, -.15), fly_(.5, 300)] },
      { len: 900, e: [bear("R", 300), fall(320, 0, .72), rock(.3, 24, 560), roe_(.4, 700)] },
      { len: 880, e: [rapid(100, 360), bear("L", 560), rock(.65, 26, 620)] },
    ],
    [ // zone 4 — THE HEADWATERS: narrow water, everything at once
      { len: 860, e: [rock(.5, 26, 180), bear("L", 360), fall(520, .25, null), roe_(.5, 700)] },
      { len: 840, e: [rapid(90, 340), rock(.35, 24, 480), rock(.68, 24, 560), fly_(.5, 640)] },
      { len: 860, e: [bear("L", 300), bear("R", 480), roe_(.5, 390), fly_(.5, 620)] },
    ],
  ];
  // The finale: BIG FALLS — jump, grind, jump — then the calm pool home.
  const FINALE = { len: 1750, e: [fall(260), log_(.5, 400, 230, .08), fall(660), log_(.5, 800, 230, -.08), fall(1060), roe_(.4, 1250), roe_(.6, 1350), fly_(.5, 1450), roe_(.5, 1550)] };
  const CALM = { len: 1100, e: [roe_(.3, 200), roe_(.7, 350), roe_(.5, 500), fly_(.4, 650), fly_(.6, 800)] };

  // ---------------------------------------------------------------------------
  // Game state
  // ---------------------------------------------------------------------------
  let state = "title"; // "title" | "play" | "paused" | "over" | "win"
  let s;               // the salmon
  let rocks, logs, falls, rapids, bears, flies, roes, particles, floaters;
  let worldY, scrollSpeed, spawnWY, lastChunk, finaleSpawned, calmSpawned, bearN;
  let score, combo, comboT, lives, elapsed, curZone, banner, shake, flash;
  let overT, winT, submitted, winStyle, winLives, winTime, winTotal;
  let seenFall, seenBear, grindTick, grindTotal;
  let tGlobal = 0, best;

  const BEST_KEY = "salmonRunBest";
  best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0;

  function newGame() {
    s = {
      x: VW / 2, y: VH * 0.72, z: 0, vz: 0, state: "water",
      rot: 0, flipping: false, flipDone: false, flipRot: 0,
      iframes: 0, buffer: 0, prevWY: 0, wob: 0,
      gl: null, gu: 0, gdir: -1,
    };
    rocks = []; logs = []; falls = []; rapids = []; bears = [];
    flies = []; roes = []; particles = []; floaters = [];
    worldY = 0; scrollSpeed = ZONES[0].scroll; spawnWY = 750;
    lastChunk = -1; finaleSpawned = false; calmSpawned = false; bearN = 0;
    score = 0; combo = 1; comboT = 0; lives = 3; elapsed = 0;
    curZone = -1; banner = null; shake = 0; flash = 0;
    overT = 0; winT = 0; submitted = false;
    seenFall = false; seenBear = false; grindTick = 0; grindTotal = 0;
    state = "play";
  }

  // ---------------------------------------------------------------------------
  // Spawning
  // ---------------------------------------------------------------------------
  function instantiate(chunk, base) {
    for (const e of chunk.e) {
      const wy = base + e.dy;
      const eL = edgeL(wy), eR = edgeR(wy), cw = eR - eL;
      const fx = (f) => eL + f * cw;
      if (e.t === "rock") rocks.push({ wy, x: fx(e.x), r: e.r, near: false, scored: false, seed: Math.random() * 9 });
      else if (e.t === "log") logs.push({ wy, x: fx(e.x), len: e.len, a: e.a, seed: Math.random() * 9 });
      else if (e.t === "fall") falls.push({ wy, x0: e.x0 == null ? eL - 4 : fx(e.x0), x1: e.x1 == null ? eR + 4 : fx(e.x1), cleared: false });
      else if (e.t === "rapid") rapids.push({ wy0: wy, wy1: wy + e.len });
      else if (e.t === "bear") bears.push({ wy, side: e.s, x: e.s === "L" ? edgeL(wy) - 24 : edgeR(wy) + 24, state: "idle", t: 0, n: bearN++ });
      else if (e.t === "fly") flies.push({ wy, x: fx(e.x), ph: Math.random() * 6, taken: false });
      else if (e.t === "roe") roes.push({ wy, x: fx(e.x), taken: false });
    }
  }
  function spawnChunks() {
    const horizon = worldY + VH + 320;
    while (spawnWY < horizon) {
      if (spawnWY >= 19700) {
        if (!finaleSpawned) { instantiate(FINALE, spawnWY); finaleSpawned = true; spawnWY += FINALE.len; continue; }
        if (!calmSpawned) { instantiate(CALM, spawnWY); calmSpawned = true; spawnWY += CALM.len; continue; }
        break; // nothing beyond the calm pool
      }
      const pool = CHUNKS[zoneOf(spawnWY)];
      let i = Math.floor(Math.random() * pool.length);
      if (pool.length > 1 && i === lastChunk) i = (i + 1) % pool.length;
      lastChunk = i;
      instantiate(pool[i], spawnWY);
      spawnWY += pool[i].len;
    }
  }
  function prune() {
    const cut = worldY - 140;
    rocks = rocks.filter(r => r.wy > cut);
    logs = logs.filter(l => l.wy > cut - 200);
    falls = falls.filter(f => f.wy > cut);
    rapids = rapids.filter(r => r.wy1 > cut);
    bears = bears.filter(b => b.wy > cut);
    flies = flies.filter(f => f.wy > cut && !f.taken);
    roes = roes.filter(r => r.wy > cut && !r.taken);
  }

  // ---------------------------------------------------------------------------
  // Scoring & juice
  // ---------------------------------------------------------------------------
  function floater(x, y, txt, col, size) {
    floaters.push({ x, y, txt, col: col || "#fde047", size: size || 17, t: 0, life: 0.95 });
  }
  function addStyle(base, label, bump) {
    const pts = base * combo;
    score += pts;
    if (bump !== false) combo = Math.min(5, combo + 1);
    comboT = 3;
    floater(s.x, s.y - 46 - s.z * 0.6, "+" + pts + " " + label, label.indexOf("SLAP") >= 0 ? "#fbbf24" : "#fde047", label.indexOf("SLAP") >= 0 ? 27 : 17);
  }
  function splash(x, y, col, n) {
    for (let i = 0; i < (n || 9); i++) {
      const a = Math.random() * TAU, sp = 40 + Math.random() * 130;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6 - 40, g: 260, t: 0, life: 0.4 + Math.random() * 0.3, size: 2 + Math.random() * 3, col: col || "#cfe8ff" });
    }
    particles.push({ x, y, ring: true, t: 0, life: 0.45, size: 6, col: "rgba(230,245,255,.7)" });
  }
  function sparkle(x, y, n, col) {
    for (let i = 0; i < (n || 6); i++) {
      const a = Math.random() * TAU, sp = 20 + Math.random() * 80;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, g: 60, t: 0, life: 0.5 + Math.random() * 0.4, size: 2, col: col || "#fde047" });
    }
  }

  function hitS(kx, ky, label) {
    if (s.iframes > 0) return;
    lives--; combo = 1; comboT = 0; s.iframes = 1.8;
    shake = 0.4; flash = 0.25;
    sfxHit();
    floater(s.x, s.y - 50, label || "OUCH!", "#f87171", 22);
    splash(s.x, s.y, "#ffb3c0");
    if (s.state === "grind") s.state = "water";
    if (s.state === "air") { s.z = 0; s.vz = 0; s.state = "water"; s.flipping = false; s.flipDone = false; }
    s.x = clamp(s.x + (kx || 0), 40, VW - 40);
    s.y = clamp(s.y + (ky || 0), VH * 0.3, VH * 0.95);
    if (lives <= 0) {
      state = "over"; overT = 0;
      best = Math.max(best, score);
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
    }
  }

  // ---------------------------------------------------------------------------
  // Salmon actions
  // ---------------------------------------------------------------------------
  const salmonWY = () => worldY + (VH - s.y);

  function doJump(v) {
    s.state = "air"; s.vz = v; s.z = Math.max(s.z, 0.01);
    s.flipping = false; s.flipDone = false; s.flipRot = 0; s.buffer = 0;
    sfxJump();
    splash(s.x, s.y, "#cfe8ff", 6);
  }
  function startFlip() {
    const remain = (s.vz + Math.sqrt(s.vz * s.vz + 2 * 2200 * Math.max(s.z, 0))) / 2200;
    s.flipping = true; s.flipRot = 0;
    s.flipSpd = TAU / Math.max(remain * 0.82, 0.18);
    sfxFlip();
  }
  function nearestSlapBear() {
    let bestB = null, bd = 1e9;
    for (const b of bears) {
      if (b.state === "stun") continue;
      const by = VH - (b.wy - worldY);
      if (by < -40 || by > VH + 40) continue;
      const hx = b.x + (b.side === "L" ? 30 : -30);
      const d = Math.hypot(s.x - hx, s.y - by);
      if (d < 118 && d < bd) { bd = d; bestB = b; }
    }
    return bestB;
  }
  function doSlap(b) {
    b.state = "stun"; b.t = 0;
    addStyle(500, "BEAR SLAP!");
    s.vz = Math.max(s.vz, 340);
    s.flipDone = false; s.flipping = false; // slap re-arms the flip
    shake = 0.35; flash = 0.12;
    sfxSlap();
    const by = VH - (b.wy - worldY);
    for (let i = 0; i < 10; i++) particles.push({ x: b.x + (b.side === "L" ? 30 : -30), y: by, vx: (Math.random() - 0.5) * 220, vy: -40 - Math.random() * 160, g: 300, t: 0, life: 0.5 + Math.random() * 0.3, size: 3, col: "#8b5a2b" });
    sparkle(s.x, s.y - s.z * 0.6, 10, "#fbbf24");
  }
  function findLog() {
    for (const lg of logs) {
      const sy = VH - (lg.wy - worldY);
      if (Math.abs(sy - s.y) > 70) continue;
      const dx = s.x - lg.x, dy = s.y - sy;
      const ca = Math.cos(lg.a), sa = Math.sin(lg.a);
      const u = dx * ca + dy * sa;
      const perp = Math.abs(-sa * dx + ca * dy);
      if (Math.abs(u) < lg.len / 2 - 6 && perp < 18) return { lg, u };
    }
    return null;
  }
  function startGrind(hit) {
    s.state = "grind"; s.gl = hit.lg; s.gu = hit.u;
    s.gdir = Math.sin(hit.lg.a) >= 0 ? -1 : 1;
    grindTick = 0; grindTotal = 0;
  }
  function endGrind(hop) {
    if (grindTotal > 0) floater(s.x, s.y - 40, "GRIND +" + grindTotal, "#a5f3fc", 16);
    s.gl = null;
    if (hop) doJump(300);
    else s.state = "water";
  }
  function tapAction() {
    if (state !== "play") return;
    if (s.state === "water") { doJump(620); return; }
    if (s.state === "grind") { endGrind(false); doJump(580); return; }
    // airborne:
    const b = nearestSlapBear();
    if (b) { doSlap(b); return; }
    if (!s.flipping && !s.flipDone) { startFlip(); return; }
    if (s.vz < 0 && s.z < 140) s.buffer = 0.12; // buffered jump for splashdown
  }
  function land() {
    s.z = 0; s.state = "water";
    sfxSplash();
    splash(s.x, s.y);
    const hit = findLog();
    if (s.flipRot >= TAU * 0.7) {
      if (hit) addStyle(150, "FLIP-TO-GRIND!");
      else addStyle(100, "FLIP!");
    }
    s.flipping = false; s.flipDone = false; s.flipRot = 0; s.rot = 0;
    if (s.buffer > 0) { doJump(620); return; }
    if (hit) startGrind(hit);
  }

  // ---------------------------------------------------------------------------
  // Update
  // ---------------------------------------------------------------------------
  const keys = {};
  let pointerActive = false, pointerSteer = false, steerTarget = null;
  let touchT0 = 0, touchP0 = null, touchMoved = 0;

  function inRapid(wy) {
    for (const r of rapids) if (wy > r.wy0 && wy < r.wy1) return true;
    return false;
  }

  function updateSalmon(dt) {
    s.wob += dt * (s.state === "grind" ? 2 : 9);
    s.iframes = Math.max(0, s.iframes - dt);
    s.buffer = Math.max(0, s.buffer - dt);
    const rapidNow = s.state === "water" && inRapid(salmonWY());

    // steering
    const authority = (s.state === "air" ? 0.5 : 1) * (rapidNow ? 0.55 : 1);
    if (s.state !== "grind") {
      let kdx = 0, kdy = 0;
      if (keys["arrowleft"] || keys["a"]) kdx -= 1;
      if (keys["arrowright"] || keys["d"]) kdx += 1;
      if (keys["arrowup"] || keys["w"]) kdy -= 1;
      if (keys["arrowdown"] || keys["s"]) kdy += 1;
      if (kdx || kdy) {
        s.x += kdx * 300 * dt * authority;
        s.y += kdy * 200 * dt * authority;
        steerTarget = null;
      } else if (pointerActive && pointerSteer && steerTarget) {
        s.x = lerp(s.x, steerTarget.x, Math.min(1, dt * 10 * authority));
        s.y = lerp(s.y, steerTarget.y, Math.min(1, dt * 6 * authority));
      }
      const wy = salmonWY();
      s.x = clamp(s.x, edgeL(wy) + 24, edgeR(wy) - 24);
      s.y = clamp(s.y, VH * 0.3, VH * 0.92);
    }

    if (s.state === "air") {
      s.vz -= 2200 * dt;
      s.z += s.vz * dt;
      if (s.flipping) {
        s.rot += s.flipSpd * dt;
        s.flipRot += s.flipSpd * dt;
        if (s.flipRot >= TAU) { s.rot = 0; s.flipping = false; s.flipDone = true; s.flipRot = TAU; }
      }
      if (s.z <= 0) land();
    } else if (s.state === "grind") {
      const lg = s.gl;
      const sy = VH - (lg.wy - worldY);
      s.gu += s.gdir * 85 * dt;
      if (Math.abs(s.gu) > lg.len / 2) { endGrind(true); return; }
      s.x = lg.x + Math.cos(lg.a) * s.gu;
      s.y = sy + Math.sin(lg.a) * s.gu;
      if (s.y > VH - 70) { endGrind(false); return; }
      grindTick += dt;
      if (grindTick >= 0.25) {
        grindTick -= 0.25;
        const pts = 12 * combo;
        score += pts; grindTotal += pts; comboT = 3;
        sfxGrind();
      }
      if (Math.random() < dt * 30) particles.push({ x: s.x + (Math.random() - 0.5) * 16, y: s.y + 6, vx: (Math.random() - 0.5) * 60, vy: -30 - Math.random() * 50, g: 200, t: 0, life: 0.3, size: 2, col: "#e8f4ff" });
    } else if (rapidNow) {
      s.y += 55 * dt;
      if (Math.random() < dt * 14) particles.push({ x: s.x + (Math.random() - 0.5) * 30, y: s.y + 8, vx: (Math.random() - 0.5) * 40, vy: 30, g: 0, t: 0, life: 0.3, size: 2, col: "#dbeafe" });
      if (s.y > VH * 0.93) { hitS(0, -240, "SWEPT UNDER!"); }
    }
  }

  function checkFalls() {
    const wy = salmonWY();
    for (const f of falls) {
      if (s.prevWY < f.wy && wy >= f.wy && s.x > f.x0 - 6 && s.x < f.x1 + 6) {
        if (s.state === "water") {
          if (s.iframes <= 0) hitS(0, 165, "SWEPT BACK!");
        } else if (!f.cleared) {
          f.cleared = true;
          addStyle(25, s.state === "grind" ? "GRIND OVER!" : "CLEARED!", false);
          sfxNear();
        }
      }
    }
    s.prevWY = wy;
  }

  function checkRocks() {
    for (const r of rocks) {
      const sy = VH - (r.wy - worldY);
      if (sy < -60 || sy > VH + 60) continue;
      const d = Math.hypot(s.x - r.x, s.y - sy);
      if (s.state === "water") {
        if (d < r.r + 12) { hitS((s.x - r.x) * 1.4, 60, "BONK!"); continue; }
        if (d < r.r + 42) r.near = true;
      }
      if (r.near && !r.scored && sy > s.y + r.r + 52) {
        r.scored = true;
        addStyle(25, "NEAR MISS!", false);
        sfxNear();
      }
    }
  }

  function updateBears(dt) {
    for (const b of bears) {
      const by = VH - (b.wy - worldY);
      b.t += dt;
      if (b.state === "idle") {
        if (by > 70 && by < VH - 60 && Math.abs(by - s.y) < 280) { b.state = "tele"; b.t = 0; }
      } else if (b.state === "tele") {
        const dur = b.n < 2 ? 1.2 : 0.8;
        if (b.t >= dur) { b.state = "lunge"; b.t = 0; zip(160, 90, 0.2, "square", 0.05); }
      } else if (b.state === "lunge") {
        const reach = 150 * smooth(b.t / 0.45);
        const dir = b.side === "L" ? 1 : -1;
        const x0 = Math.min(b.x + dir * 16, b.x + dir * 16 + dir * reach);
        const x1 = Math.max(b.x + dir * 16, b.x + dir * 16 + dir * reach);
        const onWater = s.state !== "air" || s.z < 24;
        if (onWater && s.iframes <= 0 && s.x > x0 && s.x < x1 && Math.abs(s.y - by) < 40) {
          hitS(dir * 90, 90, "GRABBED!");
        }
        if (b.t >= 0.45) { b.state = "recover"; b.t = 0; }
      } else if (b.state === "recover") {
        if (b.t >= 1.2) { b.state = "idle"; b.t = 0; }
      } else if (b.state === "stun") {
        if (b.t >= 4) { b.state = "recover"; b.t = 0.6; }
      }
    }
    // tutorial banner the first time a bear appears
    if (!seenBear) {
      for (const b of bears) {
        const by = VH - (b.wy - worldY);
        if (by > -30 && by < VH) { seenBear = true; banner = { txt: "A BEAR!", sub: "LEAP, THEN TAP TO SLAP IT", t: 0 }; sfxBanner(); break; }
      }
    }
  }

  function updateFliesRoe(dt) {
    for (const f of flies) {
      if (f.taken) continue;
      f.ph += dt * 7;
      const fy = VH - (f.wy - worldY);
      const fx = f.x + Math.sin(f.ph) * 18;
      if (s.state === "air" && s.z > 25 && Math.hypot(s.x - fx, s.y - fy) < 38) {
        f.taken = true;
        addStyle(50, "SNACK!");
        sfxYum();
        sparkle(fx, fy, 8);
      }
    }
    for (const r of roes) {
      if (r.taken) continue;
      const ry = VH - (r.wy - worldY);
      if (s.state !== "air" && Math.hypot(s.x - r.x, s.y - ry) < 30) {
        r.taken = true;
        score += 25; comboT = Math.max(comboT, 2);
        floater(r.x, ry - 20, "+25", "#fdba74", 14);
        sfxYum();
        sparkle(r.x, ry, 5, "#fdba74");
      }
    }
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.t += dt;
      if (!p.ring) { p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
      p.y += scrollSpeed * dt * 0.5;
    }
    particles = particles.filter(p => p.t < p.life);
    for (const f of floaters) { f.t += dt; f.y -= 34 * dt; }
    floaters = floaters.filter(f => f.t < f.life);
  }

  function update(dt) {
    tGlobal += dt;
    elapsed += dt;
    const wy = salmonWY();

    // zone progression + banner
    const zi = zoneOf(wy);
    if (zi > curZone) {
      curZone = zi;
      banner = { txt: "ZONE " + (zi + 1) + " — " + ZONES[zi].name, sub: null, t: 0 };
      sfxBanner();
    }
    scrollSpeed = lerp(scrollSpeed, ZONES[curZone].scroll, Math.min(1, dt * 1.2));
    worldY += scrollSpeed * dt;

    spawnChunks();
    prune();
    updateSalmon(dt);
    checkFalls();
    checkRocks();
    updateBears(dt);
    updateFliesRoe(dt);
    updateParticles(dt);

    comboT = Math.max(0, comboT - dt);
    if (comboT <= 0) combo = 1;
    if (banner) { banner.t += dt; if (banner.t > 2.1) banner = null; }
    shake = Math.max(0, shake - dt * 1.6);
    flash = Math.max(0, flash - dt * 1.8);

    // tutorial: first waterfall approaching
    if (!seenFall) {
      for (const f of falls) {
        if (f.wy - wy < 520 && f.wy > wy) { seenFall = true; banner = { txt: "WATERFALL AHEAD!", sub: "TAP TO LEAP IT", t: 0 }; sfxBanner(); break; }
      }
    }

    // home!
    if (wy > WIN_WY) {
      state = "win"; winT = 0; banner = null;
      winStyle = score;
      winLives = lives * 500;
      winTime = Math.max(0, 3000 - Math.floor(elapsed) * 12);
      winTotal = winStyle + 2000 + winLives + winTime;
      best = Math.max(best, winTotal);
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
      sfxWin();
    }
  }

  // ---------------------------------------------------------------------------
  // Input
  // ---------------------------------------------------------------------------
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if (k === " " || k.startsWith("arrow")) e.preventDefault();
    ensureAudio();
    if (k === "enter") {
      if (state === "title" || (state === "over" && overT > 0.9) || (state === "win" && winT > 3)) newGame();
      return;
    }
    if (k === " ") {
      if (state === "title" || (state === "over" && overT > 0.9) || (state === "win" && winT > 3)) newGame();
      else if (state === "paused") state = "play";
      else tapAction();
      return;
    }
    if (k === "p") {
      if (state === "play") state = "paused";
      else if (state === "paused") state = "play";
    }
    if (k === "m") muted = !muted;
  }, { passive: false });
  window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

  function pointerDown(vx, vy) {
    ensureAudio();
    touchT0 = performance.now(); touchP0 = { x: vx, y: vy }; touchMoved = 0;
    pointerActive = true; pointerSteer = false;
    if (state === "title") { newGame(); pointerActive = false; return; }
    if (state === "over" && overT > 0.9) { newGame(); pointerActive = false; return; }
    if (state === "win" && winT > 3) { newGame(); pointerActive = false; return; }
    if (state === "paused") { state = "play"; pointerActive = false; return; }
  }
  function pointerMove(vx, vy) {
    if (!pointerActive) return;
    touchMoved = Math.max(touchMoved, Math.hypot(vx - touchP0.x, vy - touchP0.y));
    if (!pointerSteer && (touchMoved > 14 || performance.now() - touchT0 > 110)) pointerSteer = true;
    if (pointerSteer) steerTarget = { x: vx, y: vy - 90 };
  }
  function pointerUp() {
    if (pointerActive && performance.now() - touchT0 < 180 && touchMoved < 14) tapAction();
    pointerActive = false; pointerSteer = false;
  }
  canvas.addEventListener("mousedown", (e) => { const p = toVirtual(e.clientX, e.clientY); pointerDown(p.x, p.y); });
  canvas.addEventListener("mousemove", (e) => { const p = toVirtual(e.clientX, e.clientY); pointerMove(p.x, p.y); });
  window.addEventListener("mouseup", () => { pointerUp(); });
  canvas.addEventListener("touchstart", (e) => { e.preventDefault(); const t = e.changedTouches[0]; const p = toVirtual(t.clientX, t.clientY); pointerDown(p.x, p.y); }, { passive: false });
  canvas.addEventListener("touchmove", (e) => { e.preventDefault(); const t = e.changedTouches[0]; const p = toVirtual(t.clientX, t.clientY); pointerMove(p.x, p.y); }, { passive: false });
  window.addEventListener("touchend", () => { pointerUp(); });

  // ---------------------------------------------------------------------------
  // Render
  // ---------------------------------------------------------------------------
  function zoneCol(arr, k) {
    // blend zone colors near boundaries for a gentle shift
    const wy = worldY + VH / 2;
    const zi = zoneOf(wy);
    const zStart = zi === 0 ? 0 : ZONES[zi - 1].end;
    const t = smooth((wy - zStart) / 900);
    const a = ZONES[Math.max(0, zi - 1)][k], b = ZONES[zi][k];
    return "rgb(" + Math.round(lerp(a[0], b[0], t)) + "," + Math.round(lerp(a[1], b[1], t)) + "," + Math.round(lerp(a[2], b[2], t)) + ")";
  }

  function drawWorld() {
    // water
    ctx.fillStyle = zoneCol(null, "water");
    ctx.fillRect(0, 0, VW, VH);

    // flowing light bands (downstream = down-screen)
    ctx.fillStyle = "rgba(255,255,255,.07)";
    for (let i = 0; i < 12; i++) {
      const y = (((i * 89 + worldY) % (VH + 60)) + VH + 60) % (VH + 60) - 30;
      const xw = Math.sin(tGlobal * 1.3 + i * 1.7) * 16;
      ctx.fillRect(70 + xw, y, VW - 140, 4);
    }
    ctx.fillStyle = "rgba(255,255,255,.045)";
    for (let i = 0; i < 9; i++) {
      const y = (((i * 117 + worldY * 0.6) % (VH + 60)) + VH + 60) % (VH + 60) - 30;
      const xw = Math.sin(tGlobal * 0.9 + i * 2.3) * 22;
      ctx.fillRect(100 + xw, y, VW - 200, 6);
    }

    // rapids bands
    for (const r of rapids) {
      const y0 = VH - (r.wy1 - worldY), y1 = VH - (r.wy0 - worldY);
      if (y1 < -20 || y0 > VH + 20) continue;
      ctx.fillStyle = "rgba(255,255,255,.10)";
      ctx.fillRect(0, y0, VW, y1 - y0);
      ctx.fillStyle = "rgba(255,255,255,.55)";
      for (let i = 0; i < 26; i++) {
        const h1 = hash(r.wy0 + i * 13.7);
        const dx = h1 * (VW - 160) + 80;
        const dy = y0 + ((h1 * 977 + tGlobal * 130) % Math.max(1, y1 - y0));
        ctx.fillRect(dx, dy, 10 + h1 * 10, 2.5);
      }
    }

    // banks
    const bankFill = zoneCol(null, "bank");
    for (const side of [0, 1]) {
      ctx.fillStyle = bankFill;
      ctx.beginPath();
      if (side === 0) { ctx.moveTo(0, -60); } else { ctx.moveTo(VW, -60); }
      for (let sy = -60; sy <= VH + 60; sy += 26) {
        const wy = worldY + (VH - sy);
        ctx.lineTo(side === 0 ? edgeL(wy) : edgeR(wy), sy);
      }
      if (side === 0) { ctx.lineTo(0, VH + 60); } else { ctx.lineTo(VW, VH + 60); }
      ctx.closePath();
      ctx.fill();
    }
    // bank edge foam + detail
    for (let sy = -20; sy <= VH + 20; sy += 34) {
      const wy = worldY + (VH - sy);
      const cell = Math.floor(wy / 34);
      const h1 = hash(cell), h2 = hash(cell + 57);
      ctx.fillStyle = "rgba(255,255,255,.28)";
      ctx.fillRect(edgeL(wy) - 1, sy, 3, 10 + h1 * 8);
      ctx.fillRect(edgeR(wy) - 2, sy + 8, 3, 10 + h2 * 8);
      if (h1 < 0.4) { // pebbles
        ctx.fillStyle = "rgba(0,0,0,.18)";
        ctx.beginPath(); ctx.arc(edgeL(wy) - 14 - h1 * 40, sy, 4 + h1 * 4, 0, TAU); ctx.fill();
      }
      if (h2 < 0.4) {
        ctx.fillStyle = "rgba(0,0,0,.18)";
        ctx.beginPath(); ctx.arc(edgeR(wy) + 14 + h2 * 40, sy, 4 + h2 * 4, 0, TAU); ctx.fill();
      }
      if (hash(cell + 91) < 0.22) { // shrubs / trees
        ctx.fillStyle = "rgba(0,40,10,.35)";
        const tx = hash(cell + 13) < 0.5 ? edgeL(wy) * 0.45 : VW - (VW - edgeR(wy)) * 0.45;
        ctx.beginPath(); ctx.arc(tx, sy, 12 + hash(cell + 29) * 14, 0, TAU); ctx.fill();
      }
    }

    // roe
    for (const r of roes) {
      if (r.taken) continue;
      const ry = VH - (r.wy - worldY);
      if (ry < -20 || ry > VH + 20) continue;
      const pulse = 1 + Math.sin(tGlobal * 5 + r.wy) * 0.15;
      ctx.fillStyle = "rgba(253,146,60,.35)";
      ctx.beginPath(); ctx.arc(r.x, ry, 13 * pulse, 0, TAU); ctx.fill();
      ctx.fillStyle = "#fb923c";
      ctx.beginPath(); ctx.arc(r.x - 4, ry - 2, 5, 0, TAU); ctx.arc(r.x + 4, ry - 1, 5, 0, TAU); ctx.arc(r.x, ry + 5, 5, 0, TAU); ctx.fill();
      ctx.fillStyle = "#fed7aa";
      ctx.beginPath(); ctx.arc(r.x - 5, ry - 3, 1.6, 0, TAU); ctx.arc(r.x + 3, ry - 2, 1.6, 0, TAU); ctx.fill();
    }

    // rocks
    for (const r of rocks) {
      const sy = VH - (r.wy - worldY);
      if (sy < -50 || sy > VH + 50) continue;
      ctx.fillStyle = "rgba(255,255,255,.25)"; // flow ripple
      ctx.beginPath(); ctx.ellipse(r.x, sy + r.r * 0.9, r.r * 1.15, 6, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "#475569";
      ctx.beginPath(); ctx.arc(r.x, sy, r.r, 0, TAU); ctx.fill();
      ctx.fillStyle = "#64748b";
      ctx.beginPath(); ctx.arc(r.x - r.r * 0.25, sy - r.r * 0.3, r.r * 0.55, 0, TAU); ctx.fill();
      ctx.fillStyle = "#334155";
      ctx.beginPath(); ctx.arc(r.x + r.r * 0.3, sy + r.r * 0.25, r.r * 0.3, 0, TAU); ctx.fill();
    }

    // waterfalls
    for (const f of falls) {
      const sy = VH - (f.wy - worldY);
      if (sy < -40 || sy > VH + 40) continue;
      const w = f.x1 - f.x0;
      ctx.fillStyle = "rgba(6,30,50,.55)"; // the drop shadow line below the ledge
      ctx.fillRect(f.x0, sy + 12, w, 8);
      ctx.fillStyle = "rgba(232,244,255,.92)";
      ctx.fillRect(f.x0, sy - 14, w, 26);
      ctx.fillStyle = "rgba(255,255,255,.9)";
      for (let i = 0; i < Math.floor(w / 18); i++) {
        const px = f.x0 + i * 18 + 4;
        const ph = (tGlobal * 240 + i * 37) % 26;
        ctx.fillRect(px, sy - 14 + ph, 6, 9);
      }
      ctx.fillStyle = "rgba(255,255,255,.5)";
      for (let i = 0; i < Math.floor(w / 30); i++) {
        const px = f.x0 + i * 30 + hash(f.wy + i) * 16;
        ctx.beginPath(); ctx.arc(px, sy + 18 + hash(i + f.wy) * 6, 3, 0, TAU); ctx.fill();
      }
    }

    // logs
    for (const lg of logs) {
      const sy = VH - (lg.wy - worldY);
      if (sy < -80 || sy > VH + 80) continue;
      ctx.save();
      ctx.translate(lg.x, sy);
      ctx.rotate(lg.a);
      ctx.fillStyle = "rgba(0,0,0,.25)";
      ctx.beginPath(); ctx.roundRect(-lg.len / 2 + 3, -9 + 5, lg.len, 20, 10); ctx.fill();
      ctx.fillStyle = "#5d3a1a";
      ctx.beginPath(); ctx.roundRect(-lg.len / 2, -10, lg.len, 20, 10); ctx.fill();
      ctx.fillStyle = "#7c4a21";
      ctx.beginPath(); ctx.roundRect(-lg.len / 2 + 3, -7, lg.len - 6, 9, 5); ctx.fill();
      ctx.strokeStyle = "rgba(40,22,8,.6)"; ctx.lineWidth = 1.5;
      for (let i = 1; i < 5; i++) {
        const bx = -lg.len / 2 + (lg.len / 5) * i;
        ctx.beginPath(); ctx.moveTo(bx, -8); ctx.lineTo(bx + 5, 8); ctx.stroke();
      }
      ctx.fillStyle = "#4d7c0f"; // mossy end
      ctx.beginPath(); ctx.arc(-lg.len / 2 + 8, 0, 8, 0, TAU); ctx.fill();
      ctx.restore();
    }

    // salmon (shadow always on the water at s.y)
    if (state !== "title") {
      const blink = s.iframes > 0 && Math.floor(tGlobal * 16) % 2 === 0;
      if (!blink) {
        const shScale = Math.max(0.4, 1 - s.z / 500);
        ctx.fillStyle = "rgba(0,10,25,.30)";
        ctx.beginPath(); ctx.ellipse(s.x, s.y, 17 * shScale, 9 * shScale, 0, 0, TAU); ctx.fill();
        const wobble = s.state === "air" ? 0 : Math.sin(s.wob) * 0.08;
        const rot = (s.state === "grind" ? s.gl.a * 0.6 : 0) + wobble + (s.flipping || s.flipRot > 0 ? s.rot : 0);
        const px = 3 * (1 + s.z / 380) * 1.45;
        drawFish(s.x, s.y - s.z * 0.6, px, rot);
      }
    }

    // bears (over the fish — they loom)
    for (const b of bears) {
      const by = VH - (b.wy - worldY);
      if (by < -70 || by > VH + 70) continue;
      drawBear(b, by);
    }

    // flies
    for (const f of flies) {
      if (f.taken) continue;
      const fy = VH - (f.wy - worldY);
      if (fy < -20 || fy > VH + 20) continue;
      const fx = f.x + Math.sin(f.ph) * 18;
      ctx.fillStyle = "rgba(0,10,25,.2)";
      ctx.beginPath(); ctx.ellipse(fx, fy + 14, 5, 2.5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "#1f2937";
      ctx.beginPath(); ctx.arc(fx, fy, 4, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgba(203,213,225," + (0.5 + 0.4 * Math.sin(f.ph * 6)) + ")";
      ctx.beginPath(); ctx.ellipse(fx - 4, fy - 3, 4, 2, -0.5, 0, TAU); ctx.ellipse(fx + 4, fy - 3, 4, 2, 0.5, 0, TAU); ctx.fill();
    }

    // particles
    for (const p of particles) {
      const a = 1 - p.t / p.life;
      if (p.ring) {
        ctx.strokeStyle = p.col; ctx.globalAlpha = a * 0.8; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size + p.t * 90, 0, TAU); ctx.stroke();
        ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = p.col; ctx.globalAlpha = a;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        ctx.globalAlpha = 1;
      }
    }

    // floaters
    for (const f of floaters) {
      const a = 1 - Math.pow(f.t / f.life, 2);
      ctx.globalAlpha = a;
      ctx.fillStyle = f.col;
      ctx.font = "800 " + f.size + "px -apple-system, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(f.txt, clamp(f.x, 70, VW - 70), f.y);
      ctx.globalAlpha = 1;
    }
    ctx.textAlign = "left";
  }

  function drawBear(b, by) {
    const dir = b.side === "L" ? 1 : -1;
    const lean = b.state === "tele" ? Math.sin(b.t * 18) * 2 : 0;
    const bx = b.x + lean;
    ctx.save();
    // body
    ctx.fillStyle = "rgba(0,10,20,.25)";
    ctx.beginPath(); ctx.ellipse(bx + 4, by + 6, 36, 27, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#4a2a12";
    ctx.beginPath(); ctx.ellipse(bx, by, 36, 27, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#6b3f1d";
    ctx.beginPath(); ctx.ellipse(bx - dir * 4, by - 3, 30, 21, 0, 0, TAU); ctx.fill();
    // paw sweep
    if (b.state === "lunge") {
      const reach = 150 * smooth(b.t / 0.45);
      ctx.fillStyle = "#6b3f1d";
      ctx.beginPath(); ctx.roundRect(dir === 1 ? bx + 16 : bx - 16 - reach, by - 11, reach, 22, 10); ctx.fill();
      const tipX = bx + dir * (16 + reach);
      ctx.fillStyle = "#3b2109";
      ctx.beginPath(); ctx.arc(tipX, by, 13, 0, TAU); ctx.fill();
      ctx.strokeStyle = "#e5e7eb"; ctx.lineWidth = 2;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath(); ctx.moveTo(tipX + dir * 6, by + i * 7); ctx.lineTo(tipX + dir * 14, by + i * 8); ctx.stroke();
      }
      ctx.fillStyle = "rgba(255,255,255,.6)";
      ctx.beginPath(); ctx.ellipse(tipX, by + 12, 16, 5, 0, 0, TAU); ctx.fill();
    }
    // head
    const hx = bx + dir * 30, hy = by;
    ctx.fillStyle = "#5d3a1a";
    ctx.beginPath(); ctx.arc(hx, hy, 17, 0, TAU); ctx.fill();
    ctx.fillStyle = "#4a2a12";
    ctx.beginPath(); ctx.arc(hx - dir * 8, hy - 12, 6, 0, TAU); ctx.arc(hx - dir * 8, hy + 12, 6, 0, TAU); ctx.fill();
    ctx.fillStyle = "#d9b38c";
    ctx.beginPath(); ctx.ellipse(hx + dir * 8, hy, 8, 6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#1f2130";
    ctx.beginPath(); ctx.arc(hx + dir * 12, hy, 2.5, 0, TAU); ctx.fill();
    if (b.state === "stun") {
      // crossed-out eyes + orbiting stars
      ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 2;
      for (const ey of [-6, 6]) {
        ctx.beginPath(); ctx.moveTo(hx - 3, hy + ey - 3); ctx.lineTo(hx + 3, hy + ey + 3); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(hx + 3, hy + ey - 3); ctx.lineTo(hx - 3, hy + ey + 3); ctx.stroke();
      }
      ctx.fillStyle = "#fde047";
      ctx.font = "700 15px -apple-system, system-ui, sans-serif";
      ctx.textAlign = "center";
      for (let i = 0; i < 3; i++) {
        const a = b.t * 4 + i * (TAU / 3);
        ctx.fillText("✦", hx + Math.cos(a) * 26, hy - 22 + Math.sin(a) * 9);
      }
      ctx.textAlign = "left";
    } else {
      ctx.fillStyle = "#0f172a";
      ctx.beginPath(); ctx.arc(hx - 1, hy - 6, 2.2, 0, TAU); ctx.arc(hx - 1, hy + 6, 2.2, 0, TAU); ctx.fill();
    }
    if (b.state === "tele") {
      const bob = Math.abs(Math.sin(b.t * 10)) * 6;
      ctx.fillStyle = "#fde047";
      ctx.font = "900 30px -apple-system, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("!", bx, by - 38 - bob);
      ctx.textAlign = "left";
    }
    ctx.restore();
  }

  function drawHUD() {
    // score + combo
    ctx.fillStyle = "#fff";
    ctx.font = "800 26px -apple-system, system-ui, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(String(score), 56, 38);
    if (combo > 1 || comboT > 0) {
      const cx = 74, cy = 74;
      ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(cx, cy, 17, 0, TAU); ctx.stroke();
      ctx.strokeStyle = combo >= 5 ? "#fbbf24" : "#fde047";
      ctx.beginPath(); ctx.arc(cx, cy, 17, -Math.PI / 2, -Math.PI / 2 + TAU * (comboT / 3)); ctx.stroke();
      ctx.fillStyle = combo >= 5 ? "#fbbf24" : "#fde047";
      ctx.font = "800 15px -apple-system, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("×" + combo, cx, cy + 5);
      ctx.textAlign = "left";
    }
    // lives
    for (let i = 0; i < 3; i++) {
      ctx.globalAlpha = i < lives ? 1 : 0.18;
      drawFish(VW - 34 - i * 32, 32, 1.4, 0);
      ctx.globalAlpha = 1;
    }
    // journey progress (right edge)
    const py0 = 140, py1 = VH - 110;
    ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(VW - 16, py0); ctx.lineTo(VW - 16, py1); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.5)";
    for (const z of ZONES) {
      const ty = py1 - (py1 - py0) * (z.end / WIN_WY);
      ctx.fillRect(VW - 21, ty, 10, 2);
    }
    ctx.font = "700 11px -apple-system, system-ui, sans-serif";
    ctx.fillStyle = "#fde047";
    ctx.textAlign = "center";
    ctx.fillText("⌂", VW - 16, py0 - 8);
    const frac = clamp(salmonWY() / WIN_WY, 0, 1);
    const my = py1 - (py1 - py0) * frac;
    ctx.fillStyle = "#fb7185";
    ctx.beginPath();
    ctx.moveTo(VW - 16, my - 7); ctx.lineTo(VW - 10, my + 4); ctx.lineTo(VW - 22, my + 4);
    ctx.closePath(); ctx.fill();
    ctx.textAlign = "left";
    if (muted) {
      ctx.fillStyle = "rgba(255,255,255,.4)";
      ctx.font = "600 13px -apple-system, system-ui, sans-serif";
      ctx.fillText("muted", 10, VH - 12);
    }
  }

  function drawBanner() {
    if (!banner) return;
    const t = banner.t;
    const a = t < 0.25 ? t / 0.25 : (t > 1.7 ? Math.max(0, 1 - (t - 1.7) / 0.4) : 1);
    ctx.globalAlpha = a * 0.82;
    ctx.fillStyle = "#05060d";
    ctx.fillRect(0, VH * 0.36, VW, banner.sub ? 96 : 72);
    ctx.globalAlpha = a;
    ctx.fillStyle = "#fde047";
    ctx.font = "900 30px -apple-system, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(banner.txt, VW / 2, VH * 0.36 + 46);
    if (banner.sub) {
      ctx.fillStyle = "rgba(255,255,255,.85)";
      ctx.font = "700 17px -apple-system, system-ui, sans-serif";
      ctx.fillText(banner.sub, VW / 2, VH * 0.36 + 76);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = "left";
  }

  function pulseText(txt, y, size, col) {
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(tGlobal * 6);
    ctx.fillStyle = col || "#fde047";
    ctx.font = "700 " + size + "px -apple-system, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(txt, VW / 2, y);
    ctx.globalAlpha = 1;
    ctx.textAlign = "left";
  }

  function drawTitle() {
    // hero fish
    drawFish(VW / 2, 268, 7.5, -0.4 + Math.sin(tGlobal * 1.4) * 0.05);
    sparkleTitle();
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.font = "700 24px -apple-system, system-ui, sans-serif";
    ctx.fillText("T H E", VW / 2, 420);
    ctx.fillStyle = "#fff";
    ctx.font = "900 62px -apple-system, system-ui, sans-serif";
    ctx.fillText("SALMON RUN", VW / 2, 482);
    ctx.fillStyle = "#fde047";
    ctx.font = "700 19px -apple-system, system-ui, sans-serif";
    ctx.fillText("· S U R V I V I N G   I N   S T Y L E ·", VW / 2, 522);
    ctx.fillStyle = "rgba(255,255,255,.85)";
    ctx.font = "600 16px -apple-system, system-ui, sans-serif";
    ctx.fillText("DRAG to swim upstream", VW / 2, 592);
    ctx.fillText("TAP to leap waterfalls · land on logs to GRIND", VW / 2, 620);
    ctx.fillText("TAP mid-air to FLIP — or SLAP a bear in the face", VW / 2, 648);
    pulseText("TAP TO START", 730, 27);
    if (best > 0) {
      ctx.fillStyle = "rgba(255,255,255,.55)";
      ctx.font = "600 15px -apple-system, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("BEST " + best, VW / 2, 776);
    }
    ctx.textAlign = "left";
  }
  function sparkleTitle() {
    ctx.fillStyle = "rgba(253,224,71,.8)";
    for (let i = 0; i < 7; i++) {
      const a = tGlobal * 0.7 + i * (TAU / 7);
      const r = 120 + Math.sin(tGlobal * 2 + i * 3) * 18;
      const sz = 2 + ((i * 7) % 3);
      ctx.fillRect(VW / 2 + Math.cos(a) * r - sz / 2, 268 + Math.sin(a) * r * 0.55 - sz / 2, sz, sz);
    }
  }

  function drawOver() {
    ctx.fillStyle = "rgba(5,6,13,.72)";
    ctx.fillRect(0, 0, VW, VH);
    ctx.textAlign = "center";
    ctx.fillStyle = "#f43f5e";
    ctx.font = "900 44px -apple-system, system-ui, sans-serif";
    ctx.fillText("THE RUN ENDS HERE", VW / 2, VH / 2 - 110);
    ctx.fillStyle = "#fff";
    ctx.font = "700 26px -apple-system, system-ui, sans-serif";
    ctx.fillText("STYLE SCORE  " + score, VW / 2, VH / 2 - 48);
    ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.font = "600 17px -apple-system, system-ui, sans-serif";
    ctx.fillText("BEST  " + best, VW / 2, VH / 2 - 16);
    ctx.fillText("you made it to " + ZONES[curZone].name + " (" + Math.round(clamp(salmonWY() / WIN_WY, 0, 1) * 100) + "% home)", VW / 2, VH / 2 + 18);
    if (overT > 0.9) pulseText("TAP TO SWIM AGAIN", VH / 2 + 78, 22);
    ctx.textAlign = "left";
  }

  function drawWin() {
    ctx.fillStyle = "rgba(5,6,13,.66)";
    ctx.fillRect(0, 0, VW, VH);
    ctx.textAlign = "center";
    ctx.fillStyle = "#fbbf24";
    ctx.font = "900 46px -apple-system, system-ui, sans-serif";
    ctx.fillText("YOU MADE IT HOME", VW / 2, 200);
    ctx.fillStyle = "rgba(255,255,255,.8)";
    ctx.font = "700 18px -apple-system, system-ui, sans-serif";
    ctx.fillText("· THE SPAWNING GROUNDS ·", VW / 2, 236);
    drawFish(VW / 2, 320, 6, -0.35 + Math.sin(tGlobal * 1.6) * 0.06);
    const lines = [
      ["STYLE", winStyle, 0.6],
      ["FINISH BONUS", 2000, 1.0],
      ["LIVES ×500", winLives, 1.4],
      ["TIME BONUS", winTime, 1.8],
    ];
    ctx.font = "700 21px -apple-system, system-ui, sans-serif";
    let ly = 430;
    for (const [label, val, at] of lines) {
      if (winT > at) {
        ctx.fillStyle = "rgba(255,255,255,.85)";
        ctx.textAlign = "left"; ctx.fillText(label, VW / 2 - 150, ly);
        ctx.textAlign = "right"; ctx.fillText(String(val), VW / 2 + 150, ly);
      }
      ly += 40;
    }
    ctx.textAlign = "center";
    if (winT > 2.2) {
      ctx.fillStyle = "#fde047";
      ctx.font = "900 36px -apple-system, system-ui, sans-serif";
      ctx.fillText("TOTAL  " + winTotal, VW / 2, ly + 26);
      ctx.fillStyle = "rgba(255,255,255,.6)";
      ctx.font = "600 15px -apple-system, system-ui, sans-serif";
      ctx.fillText("BEST  " + best, VW / 2, ly + 58);
    }
    if (winT > 3) pulseText("TAP TO RUN AGAIN", ly + 118, 22);
    ctx.textAlign = "left";
  }

  function render() {
    ctx.save();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = "#05060d";
    ctx.fillRect(0, 0, W, H);
    const shx = shake > 0 ? (Math.random() - 0.5) * shake * 26 : 0;
    const shy = shake > 0 ? (Math.random() - 0.5) * shake * 26 : 0;
    ctx.translate(ox + shx * scale, oy + shy * scale);
    ctx.scale(scale, scale);
    ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();

    drawWorld();

    if (state === "title") drawTitle();
    else {
      drawHUD();
      drawBanner();
      if (flash > 0) { ctx.globalAlpha = flash; ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, VW, VH); ctx.globalAlpha = 1; }
      if (state === "paused") {
        ctx.fillStyle = "rgba(5,6,13,.6)"; ctx.fillRect(0, 0, VW, VH);
        ctx.textAlign = "center"; ctx.fillStyle = "#fff";
        ctx.font = "800 40px -apple-system, system-ui, sans-serif";
        ctx.fillText("PAUSED", VW / 2, VH / 2 - 10);
        ctx.font = "500 18px -apple-system, system-ui, sans-serif";
        ctx.fillStyle = "rgba(255,255,255,.8)";
        ctx.fillText("press P or tap to resume", VW / 2, VH / 2 + 26);
        ctx.textAlign = "left";
      }
      if (state === "over") drawOver();
      if (state === "win") drawWin();
    }

    ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, VW - 2, VH - 2);
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------------------
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;
    if (state === "play") update(dt);
    else if (state === "title") { tGlobal += dt; worldY += 42 * dt; }
    else if (state === "over") {
      tGlobal += dt; overT += dt; updateParticles(dt);
      if (overT > 1.2 && !submitted) { submitted = true; if (window.AWSMLB && score > 0) AWSMLB.record("The Salmon Run", score); }
    } else if (state === "win") {
      tGlobal += dt; winT += dt; worldY += 26 * dt; updateParticles(dt);
      if (Math.random() < dt * 6) sparkle(80 + Math.random() * (VW - 160), 100 + Math.random() * (VH - 200), 2, "#fde68a");
      if (winT > 2.5 && !submitted) { submitted = true; if (window.AWSMLB) AWSMLB.record("The Salmon Run", winTotal); }
    } else if (state === "paused") { tGlobal += dt; }
    render();
    requestAnimationFrame(frame);
  }
  // Portrait game: pause play if the phone is turned to landscape (overlay nudges back).
  const landMQ = window.matchMedia("(orientation: landscape) and (max-height: 600px)");
  function onLandscape() { if (landMQ.matches && state === "play") state = "paused"; }
  if (landMQ.addEventListener) landMQ.addEventListener("change", onLandscape); else landMQ.addListener(onLandscape);

  newGame();        // initialize the world once so the title screen can render it
  state = "title";
  requestAnimationFrame(frame);
})();
</script>
<!-- Quit to arcade -->
<button id="quitBtn" type="button" aria-label="Quit to arcade" title="Quit">✕</button>
<style>
  #quitBtn{ position:fixed; z-index:99999; left:10px; top:10px; width:32px; height:32px;
    display:flex; align-items:center; justify-content:center; padding:0; margin:0;
    border:1px solid rgba(255,255,255,.22); border-radius:9px; color:rgba(255,255,255,.85);
    background:rgba(18,18,28,.5); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
    font:700 15px -apple-system, system-ui, sans-serif; line-height:1; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  #quitBtn:hover{ background:rgba(40,40,60,.8); }
  #quitBtn:active{ transform:scale(.94); }
</style>
<script>
(function(){
  var b=document.getElementById('quitBtn'); if(!b) return;
  function stop(e){ e.stopPropagation(); }
  b.addEventListener('mousedown', stop, true);
  b.addEventListener('touchstart', stop, {capture:true, passive:true});
  b.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); location.href='./'; });
})();
</script>
</body>
</html>
