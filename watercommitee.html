<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watercommitee Rota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #FBF3F7;
    --panel: #FFFFFF;
    --ink: #3B2136;
    --muted: #8F6580;
    --dim: #C09FB1;
    --accent: #C9497E;
    --accent-ink: #A83567;
    --tint: #F7DFEB;
    --line: #F0DCE7;
    --now-ink: #FFFFFF;
    --hero-g1: #D2568C;
    --hero-g2: #E58F6F;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #251524;
      --panel: #321F30;
      --ink: #F4E3EE;
      --muted: #C9A0B9;
      --dim: #7F5C74;
      --accent: #E27BA8;
      --accent-ink: #F2AECB;
      --tint: #3D2439;
      --line: #452B41;
      --now-ink: #2A1226;
      --hero-g1: #B44A7C;
      --hero-g2: #C97155;
    }
  }
  :root[data-theme="dark"] {
    --ground: #251524;
    --panel: #321F30;
    --ink: #F4E3EE;
    --muted: #C9A0B9;
    --dim: #7F5C74;
    --accent: #E27BA8;
    --accent-ink: #F2AECB;
    --tint: #3D2439;
    --line: #452B41;
    --now-ink: #2A1226;
    --hero-g1: #B44A7C;
    --hero-g2: #C97155;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Public Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 40px 20px 64px;
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
  }

  header .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-ink);
    margin: 0 0 6px;
  }
  header h1 {
    font-family: "Bricolage Grotesque", "Public Sans", sans-serif;
    font-weight: 800;
    font-size: clamp(19px, 5.6vw, 36px);
    letter-spacing: -0.01em;
    margin: 0;
    white-space: nowrap;
  }

  .hero {
    margin-top: 24px;
    background: linear-gradient(135deg, var(--hero-g1), var(--hero-g2));
    color: var(--now-ink);
    border-radius: 14px;
    padding: 26px 26px 28px;
    position: relative;
    overflow: hidden;
  }
  .hero .drop {
    position: absolute;
    right: -14px;
    top: -22px;
    font-size: 120px;
    line-height: 1;
    opacity: 0.16;
    transform: rotate(12deg);
    user-select: none;
  }
  .hero .label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.85;
    margin: 0 0 4px;
  }
  .hero .name {
    font-family: "Bricolage Grotesque", "Public Sans", sans-serif;
    font-weight: 800;
    font-size: clamp(42px, 11vw, 64px);
    line-height: 1.05;
    margin: 0;
  }
  .hero .sub {
    margin: 8px 0 0;
    font-size: 14px;
    opacity: 0.85;
    font-variant-numeric: tabular-nums;
  }

  .upnext {
    margin-top: 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 26px 20px;
  }
  .upnext .label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 2px;
  }
  .upnext .name {
    font-family: "Bricolage Grotesque", "Public Sans", sans-serif;
    font-weight: 600;
    font-size: clamp(22px, 6vw, 28px);
    margin: 0;
  }
  .upnext .sub {
    margin: 4px 0 0;
    font-size: 13.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  footer {
    margin-top: 24px;
    font-size: 12.5px;
    color: var(--dim);
    text-align: center;
  }

  @media (max-width: 430px) {
    .wrap { padding-top: 26px; padding-bottom: 44px; }
    .hero { margin-top: 18px; padding: 22px 20px 24px; border-radius: 12px; }
    .hero .name { font-size: clamp(40px, 15vw, 56px); overflow-wrap: anywhere; }
    .hero .drop { font-size: 92px; right: -16px; top: -20px; }
    .upnext { padding: 16px 20px 18px; border-radius: 12px; }
  }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">The Doors</p>
    <h1>🌸 Watercommitee Rota 🌼</h1>
  </header>

  <div class="hero" id="hero">
    <span class="drop" aria-hidden="true">🌷</span>
    <p class="label">This week it&rsquo;s&hellip;</p>
    <p class="name" id="heroName">&mdash;</p>
    <p class="sub" id="heroSub"></p>
  </div>
  <div class="upnext" id="upnext" hidden>
    <p class="label">Next week</p>
    <p class="name" id="nextName"></p>
    <p class="sub" id="nextSub"></p>
  </div>

  <footer>Weeks start Monday · updates itself from today&rsquo;s date</footer>
</div>

<script>
  // Anchor: Mon 8 Jun 2026 (ISO week 24) = Ellen, then the cycle repeats forever.
  var ORDER = ["Ellen", "Rob", "Juliette", "Oliver", "Bart"];
  var ANCHOR = new Date(2026, 5, 8); // local midnight
  var MS_DAY = 24 * 60 * 60 * 1000;
  var fmt = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", year: "numeric" });

  function mondayOf(d) {
    var m = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    m.setDate(m.getDate() - ((m.getDay() + 6) % 7));
    return m;
  }
  function isoWeek(d) {
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7)); // Thursday of this week
    var jan4 = new Date(t.getFullYear(), 0, 4);
    return 1 + Math.round((mondayOf(t) - mondayOf(jan4)) / (7 * MS_DAY));
  }
  function personFor(monday) {
    var weeks = Math.round((monday - ANCHOR) / (7 * MS_DAY));
    return ORDER[((weeks % ORDER.length) + ORDER.length) % ORDER.length];
  }

  var today = new Date();
  today.setHours(0, 0, 0, 0);
  var thisMon = mondayOf(today);
  var nextMon = new Date(thisMon.getFullYear(), thisMon.getMonth(), thisMon.getDate() + 7);

  var heroName = document.getElementById("heroName");
  var heroSub = document.getElementById("heroSub");
  var upnext = document.getElementById("upnext");
  var nextName = document.getElementById("nextName");
  var nextSub = document.getElementById("nextSub");

  if (thisMon >= ANCHOR) {
    var sun = new Date(thisMon.getFullYear(), thisMon.getMonth(), thisMon.getDate() + 6);
    heroName.textContent = personFor(thisMon);
    heroSub.textContent = "Week " + isoWeek(thisMon) + " · " + fmt.format(thisMon) + " – " + fmt.format(sun);
  } else {
    heroName.textContent = "Nobody yet";
    heroSub.textContent = "Rota starts week 24 · " + fmt.format(ANCHOR);
    nextMon = ANCHOR;
  }
  upnext.hidden = false;
  nextName.textContent = personFor(nextMon);
  nextSub.textContent = "Week " + isoWeek(nextMon) + " · from " + fmt.format(nextMon);
</script>

</body>
</html>
