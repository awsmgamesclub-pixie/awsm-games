<style>
  :root{--bg:#111;--card:#1b1b1b;--fg:#eee;--mut:#9a9a9a;--acc:#f5b324}
  *{box-sizing:border-box}

  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,system-ui,sans-serif;
       padding:24px max(24px,env(safe-area-inset-right)) 60px max(24px,env(safe-area-inset-left))}

  .day{scroll-margin-top:60px}
  .day>h2{font-size:24px;margin:34px 0 2px}

  .g .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
  article{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer}

  article .meta{padding:10px 12px 12px}
  article p{margin:0;color:#ddd}
  article .det{color:var(--mut);font-size:12px;margin-top:4px}
  #sentinel{height:1px}

  #lb .cap small{display:block;color:#999;margin-top:2px}

  #lb .prev{left:0} #lb .next{right:0}
  #lb.vid .nav{bottom:140px}
  .keys{color:#888;font-size:12px}

  #lb .top{position:fixed;z-index:3;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;justify-content:space-between;pointer-events:none}

  #lb .nav{top:76px}

  article.phone p{color:#222} article.phone .det{color:#6d6a63}
  article.phone .meta{padding:10px 6px 12px}

  .pbadge svg{width:12px;height:12px}

  #status{display:none;color:var(--mut);font-size:13px;margin:10px 0 0}
  .edit #status{display:block} #status b{color:var(--fg)}
  .tog{display:none;position:absolute;top:10px;right:10px;z-index:2;border:0;border-radius:6px;padding:7px 11px;font:600 12px system-ui;cursor:pointer;background:rgba(0,0,0,.7);color:#fff}

  article{position:relative}
  #lbtog{display:none} .edit #lbtog{display:inline-block;background:#e5484d} .edit #lbtog.rs{background:#3fb950}

let editing = false; const removed = new Set();   // edit mode state (local only)
// flatten: every item knows its day + group; the viewer browses across days
const all = []; D.days.forEach((d, di) => d.items.forEach(i => all.push(Object.assign({day: di}, i))));
document.getElementById('t').textContent = D.title;
document.getElementById('st').textContent = D.subtitle;
const nav = document.getElementById('nav');
D.days.forEach((d, di) => { const a = document.createElement('a'); a.href = '#day' + (di + 1); a.textContent = d.label; a.dataset.d = di; nav.appendChild(a); });

// ---- infinite scroll: render cards in batches as the reader nears the bottom
const BATCH = 12; let rendered = 0, curDay = -1, curGroup = null, grid = null;
const m = document.getElementById('m');
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { const im = e.target;
  if (im.dataset.srcset) { im.sizes = '(max-width: 600px) 100vw, 500px'; im.srcset = im.dataset.srcset; }
  im.src = im.dataset.src; io.unobserve(im); } }), {rootMargin: '900px 0px'});
function addBatch() {
  const stop = Math.min(all.length, rendered + BATCH);
  for (; rendered < stop; rendered++) {
    const i = all[rendered], k = rendered;
    if (i.day !== curDay) {
      curDay = i.day; curGroup = null; const d = D.days[curDay];
      const sec = document.createElement('section'); sec.className = 'day'; sec.id = 'day' + (curDay + 1);
      sec.innerHTML = '<h2></h2><p class="dsub"></p>'; sec.querySelector('h2').textContent = d.label; sec.querySelector('.dsub').textContent = d.sub || '';
      m.appendChild(sec); daySecs[curDay] = sec;
    }
    if (i.group !== curGroup) {
      curGroup = i.group; const h = document.createElement('h3'); h.className = 'grp'; h.textContent = i.group;
      daySecs[curDay].appendChild(h); grid = makeGrid(); daySecs[curDay].appendChild(grid);
    }
    const a = document.createElement('article');
    const PH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>';
    if (i.phone) a.classList.add('phone');
    a.innerHTML = `<div class="ph"><img alt="">${i.video ? '<div class="play"><span></span></div>' : ''}${i.phone ? '<span class="pbadge">' + PH + 'Phone</span>' : ''}</div><div class="meta"><p></p><div class="det"></div></div>`;
    const im = a.querySelector('img'); im.dataset.src = i.thumb; im.onload = () => im.classList.add('ld'); io.observe(im);
    if (!i.video && i.fw) im.dataset.srcset = `${i.thumb} ${i.tw}w, ${i.full} ${i.fw}w`;
    if (i.w && i.h) im.style.aspectRatio = i.w + '/' + i.h;   // reserve space so the page doesn't jump while loading
    a.querySelector('p').textContent = i.note; a.querySelector('.det').textContent = i.details || '';
    a.onclick = () => show(k); a._k = k; a.id = 'c' + i.id;
    const tg = document.createElement('button'); tg.className = 'tog'; a.appendChild(tg);
    tg.onclick = ev => { ev.stopPropagation(); toggle(i.id); }; paintCard(a, i.id);
    place(grid, a, i);
  }
  if (rendered >= all.length && !document.querySelector('.end')) {
    const e = document.createElement('p'); e.className = 'end'; e.textContent = D.end || ''; m.appendChild(e);
  }
}
const daySecs = [];
const nCols = () => innerWidth <= 600 ? 1 : innerWidth < 1000 ? 2 : 3;
function makeGrid() {
  const g = document.createElement('div'); g.className = 'g'; g._h = [];
  for (let c = 0; c < nCols(); c++) { const col = document.createElement('div'); col.className = 'col'; g.appendChild(col); g._h.push(0); }
  return g;
}
function place(g, a, i) {   // append to the shortest column, tracked by aspect ratio (+ caption allowance)
  let c = 0; g._h.forEach((h, k) => { if (h < g._h[c]) c = k; });
  g.children[c].appendChild(a); g._h[c] += (i.h && i.w ? i.h / i.w : .66) + .16;
  a._item = i;
}
// on a width change that alters the column count, re-flow existing cards in order (rare)
let lastCols = nCols();
addEventListener('resize', () => {
  if (nCols() === lastCols) return; lastCols = nCols();
  document.querySelectorAll('.g').forEach(g => {
    const cards = [...g.querySelectorAll('article')].sort((x, y) => x._k - y._k);
    const ng = makeGrid(); cards.forEach(a => place(ng, a, a._item)); g.replaceWith(ng);
    if (grid === g) grid = ng;
  });
});
const more = new IntersectionObserver(es => { if (es[0].isIntersecting && rendered < all.length) addBatch(); }, {rootMargin: '1200px 0px'});
addBatch(); more.observe(document.getElementById('sentinel'));
// day pills: render up to that day first, then jump; highlight the day in view
nav.addEventListener('click', e => {
  const a = e.target.closest('a'); if (!a) return; e.preventDefault(); const di = +a.dataset.d;
  while (!daySecs[di] && rendered < all.length) addBatch();
  daySecs[di].scrollIntoView({behavior: 'smooth'});
});
addEventListener('scroll', () => {
  let on = 0; daySecs.forEach((s, di) => { if (s && s.getBoundingClientRect().top < 120) on = di; });
  nav.querySelectorAll('a').forEach(a => a.classList.toggle('on', +a.dataset.d === on));
}, {passive: true});
nav.querySelector('a').classList.add('on');

// ---- edit mode: only when this page is served by the local save server (never on the public site)
function paintCard(a, id) { if (!a) return; a.classList.toggle('removed', removed.has(id)); const t = a.querySelector('.tog'); if (t) t.textContent = removed.has(id) ? 'Restore' : 'Remove'; }
function status() { const k = all.length - [...removed].filter(id => all.some(i => i.id === id)).length;
  document.getElementById('status').innerHTML = `Editing: <b>${k}</b> of ${all.length} kept · removed photos are left out next time the shared page is published · saved automatically`; }
async function save() { let ok = false; try { ok = (await fetch('state', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({removed: [...removed]})})).ok; } catch (e) {}
  status(); if (!ok) { const w = document.createElement('b'); w.style.color = '#ff6b6b'; w.textContent = ' NOT SAVED: the local server is not running, tell Claude'; document.getElementById('status').appendChild(w); alert('That change was NOT saved. The local server is not running, so please tell Claude.'); } }
function toggle(id) { removed.has(id) ? removed.delete(id) : removed.add(id); save(); paintCard(document.getElementById('c' + id), id); if (cur >= 0) paintLb(); }
function paintLb() { const b = document.getElementById('lbtog'), r = removed.has(all[cur].id); b.textContent = r ? 'Restore' : 'Remove'; b.classList.toggle('rs', r); }
document.getElementById('lbtog').onclick = () => toggle(all[cur].id);
(async () => { try { const r = await fetch('state', {cache: 'no-store'}); if (r.ok && (r.headers.get('content-type') || '').includes('json')) {
  editing = true; document.body.classList.add('edit'); ((await r.json()).removed || []).forEach(x => removed.add(String(x)));
  document.querySelectorAll('article').forEach(a => paintCard(a, a.id.slice(1))); status(); } } catch (e) {} })();

// ---- full-screen viewer (photos fill the screen, the video plays)
const lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg'), lbvid = document.getElementById('lbvid');
let cur = -1;
function show(k, fromHistory) {
  const opening = !lb.classList.contains('on');
  cur = (k + all.length) % all.length; const i = all[cur];
  if (!fromHistory) { const st = {rr: 'photo', k: cur}; opening ? history.pushState(st, '') : history.replaceState(st, ''); }
  lbvid.pause();
  if (i.video) { lb.classList.add('vid'); lbvid.poster = i.full; if (lbvid.getAttribute('src') !== i.video) lbvid.src = i.video; }
  else { lb.classList.remove('vid'); lbimg.src = i.full; }
  document.getElementById('lbn').textContent = `${D.days[i.day].label} · ${cur + 1}/${all.length}`;
  document.getElementById('lbnote').textContent = i.note;
  document.getElementById('lbdet').textContent = (i.phone ? '📱 ' : '') + (i.details || '');
  lb.classList.add('on'); document.body.style.overflow = 'hidden'; if (editing) paintLb();
  const nx = all[(cur + 1) % all.length]; if (!nx.video) { const p = new Image(); p.src = nx.full; }
}
function hideLb() { lb.classList.remove('on', 'vid'); lbimg.style.transform = ''; lbvid.pause(); document.body.style.overflow = ''; cur = -1; }
function closeLb() { if (!lb.classList.contains('on')) return; (history.state && history.state.rr === 'photo') ? history.back() : hideLb(); }

// Back button: photo -> album -> ask before leaving the page
const leave = document.getElementById('leave');
history.scrollRestoration = 'manual';   // otherwise Chrome jumps to the top when Back shows the warning
if (!(history.state && history.state.rr)) { history.replaceState({rr: 'base'}, ''); history.pushState({rr: 'album'}, ''); }
else if (history.state.rr === 'photo') history.replaceState({rr: 'album'}, '');
addEventListener('popstate', e => {
  if (leaving) return;
  const st = e.state || {};
  if (st.rr === 'photo') { while (rendered <= st.k && rendered < all.length) addBatch(); show(st.k, true); return; }
  if (lb.classList.contains('on')) hideLb();
  if (st.rr === 'base') { history.pushState({rr: 'album'}, ''); leave.classList.add('on'); document.getElementById('stay').focus(); }
});
function stayHere() {
  leave.classList.remove('on');
  if (leaving) { leaving = false; document.getElementById('lvh').textContent = 'Leave the album?'; document.getElementById('lvp').textContent = "You're about to leave this page."; document.getElementById('go').style.display = '';
    if (!history.state || history.state.rr !== 'album') history.pushState({rr: 'album'}, ''); }
}
document.getElementById('stay').onclick = stayHere;
leave.addEventListener('click', e => { if (e.target === leave) stayHere(); });
let leaving = false;
document.getElementById('go').onclick = () => {
  leaving = true; history.go(-2);   // the page before the album
  setTimeout(() => { history.back(); document.getElementById('lvh').textContent = 'Press Back once more'; document.getElementById('lvp').textContent = 'There is no earlier page in this tab, so Back will now close it.'; document.getElementById('go').style.display = 'none'; }, 900);   // opened in a fresh tab: step out of the guard so Back exits
};
lbimg.addEventListener('click', () => { if (moved) { moved = false; return; } if (!pinched()) closeLb(); });   // tapping the open photo goes back to the album
document.getElementById('lbx').onclick = closeLb;
document.getElementById('lbback').onclick = closeLb;
lb.querySelector('.prev').onclick = () => show(cur - 1);
lb.querySelector('.next').onclick = () => show(cur + 1);
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('on')) return;
  if (editing && (e.key === 'x' || e.key === 'X')) { toggle(all[cur].id); return; }
  if (e.key === 'ArrowRight') show(cur + 1); else if (e.key === 'ArrowLeft') show(cur - 1); else if (e.key === 'Escape') closeLb();
});
let sx = null, sy = null, moved = false;
const pinched = () => window.visualViewport && visualViewport.scale > 1.02;
lb.addEventListener('touchstart', e => {
  moved = false;
  if (e.touches.length > 1 || pinched() || e.target.closest('button,video')) { sx = null; return; }
  sx = e.touches[0].clientX; sy = e.touches[0].clientY; lbimg.style.transition = '';
}, {passive: true});
lb.addEventListener('touchmove', e => {
  if (sx === null) return;
  if (e.touches.length > 1) { sx = null; lbimg.style.transform = ''; return; }
  const dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
  if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
  if (e.cancelable) e.preventDefault();
  lbimg.style.transform = Math.abs(dx) > Math.abs(dy) ? `translateX(${dx}px)` : `translateY(${dy}px)`;
}, {passive: false});
function endSwipe(e) {
  if (sx === null) return;
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; sx = null; lbimg.style.transform = '';
  if (e.type === 'touchcancel') return;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) show(cur + (dx < 0 ? 1 : -1));
  else if (Math.abs(dy) > 60 && Math.abs(dy) > Math.abs(dx)) closeLb();   // swipe down or up closes
}
lb.addEventListener('touchend', endSwipe); lb.addEventListener('touchcancel', endSwipe);
</script>
