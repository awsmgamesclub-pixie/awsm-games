<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Birds, cats &amp; the coast</title>
<style>
  :root{--bg:#111;--card:#1b1b1b;--fg:#eee;--mut:#9a9a9a;--acc:#f5b324;--bad:#e5484d;--ok:#3fb950}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,system-ui,sans-serif;padding:24px}
  header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:baseline;justify-content:space-between}
  h1{margin:0;font-size:26px}
  .sub{color:var(--mut);margin:4px 0 0}
  .status{color:var(--mut);font-size:13px}
  .status b{color:var(--fg)}
  h2{color:var(--acc);margin:28px 0 12px;font-size:18px}
  .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
  article{background:var(--card);border-radius:10px;overflow:hidden;position:relative;transition:opacity .15s}
  article img{width:100%;display:block;cursor:zoom-in;aspect-ratio:3/2;object-fit:cover;background:#000}
  article .meta{padding:10px 12px 12px}
  article h3{margin:0;font-size:15px}
  article p{margin:4px 0 0;color:#ccc}
  article small{display:block;color:var(--mut);margin-top:4px}
  article.removed{opacity:.35}
  article.removed::after{content:"Removed";position:absolute;top:10px;left:10px;background:var(--bad);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:4px}
  .tog{position:absolute;top:10px;right:10px;border:0;border-radius:6px;padding:6px 10px;font:600 12px system-ui;cursor:pointer;background:rgba(0,0,0,.65);color:#fff}
  .tog:hover{background:var(--bad)}
  article.removed .tog:hover{background:var(--ok)}
  /* full-screen viewer */
  #lb{position:fixed;inset:0;background:#000;display:none;z-index:10}
  #lb.on{display:block}
  #lb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;cursor:zoom-in}
  #lb.zoom{overflow:auto}
  #lb.zoom img{position:static;width:auto;height:auto;max-width:none;cursor:zoom-out}
  #lb.zoom .nav{display:none}
  #lb .bar,#lb .tag{position:fixed}
  #lb .bar{position:fixed;left:0;right:0;bottom:0;padding:14px 18px;display:flex;gap:16px;align-items:center;
           background:linear-gradient(transparent,rgba(0,0,0,.85));flex-wrap:wrap}
  #lb .cap{flex:1;min-width:200px}
  #lb .cap b{font-size:16px}
  #lb .cap span{color:#bbb;margin-left:10px}
  #lb button{border:0;border-radius:8px;padding:10px 14px;font:600 14px system-ui;cursor:pointer;color:#fff;background:#333}
  #lb button.rm{background:var(--bad)}
  #lb button.rs{background:var(--ok)}
  #lb .nav{position:absolute;top:0;bottom:70px;width:18%;cursor:pointer}
  #lb .prev{left:0} #lb .next{right:0}
  #lb .tag{position:fixed;top:16px;left:16px;background:var(--bad);color:#fff;font-weight:600;padding:5px 10px;border-radius:6px;display:none}
  #lb.isrm .tag{display:block}
  .keys{color:#888;font-size:12px}
  .ro .tog,.ro #lbtog,.ro #status{display:none}
  article .det{color:var(--mut);font-size:12px;margin-top:2px}
  #lbdet{color:#999;margin-left:10px;font-size:13px}
  @media (max-width:500px){body{padding:16px}.g{grid-template-columns:1fr}.keys{display:none}}
</style>
</head>
<body>
<header>
  <div><h1 id="t"></h1><p class="sub" id="st"></p></div>
  <div class="status" id="status"></div>
</header>
<main id="m"></main>
<section id="lo"></section>

<div id="lb" aria-modal="true" role="dialog">
  <img id="lbimg" alt="">
  <div class="tag">Removed from selects</div>
  <div class="nav prev" title="Previous"></div><div class="nav next" title="Next"></div>
  <div class="bar">
    <div class="cap"><b id="lbn"></b><span id="lbnote"></span><span id="lbdet"></span></div>
    <span class="keys" id="keys">click = zoom to 100% · ← → browse · X remove/restore · Esc close</span>
    <button id="lbtog"></button>
    <button id="lbclose">Close</button>
  </div>
</div>

<script>
const D = {"title": "Birds, cats & the coast", "subtitle": "22 November 2026 \u00b7 click a photo for full screen, click again to zoom in", "left_out": "", "items": [{"n": 594, "group": "Birds", "note": "Blue-tailed bee-eater flicking an insect up to swallow it: sharpest head of all 36 frames", "best_of": "", "details": "72mm \u00b7 f/5.6 \u00b7 1/1000s \u00b7 ISO 100 \u00b7 DSC-RX100M7A"}, {"n": 589, "group": "Birds", "note": "Bee-eater holding the insect crosswise in its beak", "best_of": "", "details": "72mm \u00b7 f/5.6 \u00b7 1/1000s \u00b7 ISO 100 \u00b7 DSC-RX100M7A"}, {"n": 607, "group": "Birds", "note": "Bee-eater, clean side view in softer light", "best_of": "", "details": "72mm \u00b7 f/4.5 \u00b7 1/1000s \u00b7 ISO 100 \u00b7 DSC-RX100M7A"}, {"n": 569, "group": "Birds", "note": "Pacific swallow in the rain, side profile: red throat and beak pin-sharp", "best_of": "", "details": "72mm \u00b7 f/4.5 \u00b7 1/200s \u00b7 ISO 125 \u00b7 DSC-RX100M7A"}, {"n": 560, "group": "Birds", "note": "Pacific swallow on the cable, full side view", "best_of": "", "details": "72mm \u00b7 f/4.5 \u00b7 1/200s \u00b7 ISO 320 \u00b7 DSC-RX100M7A"}, {"n": 566, "group": "Birds", "note": "Pacific swallow against the red tin roof", "best_of": "", "details": "72mm \u00b7 f/4.5 \u00b7 1/200s \u00b7 ISO 160 \u00b7 DSC-RX100M7A"}, {"n": 581, "group": "Birds", "note": "Pacific swallow, face three-quarter on", "best_of": "", "details": "72mm \u00b7 f/4.5 \u00b7 1/200s \u00b7 ISO 200 \u00b7 DSC-RX100M7A"}, {"n": 626, "group": "Birds", "note": "Great egret on the canal wall: sharpest of the burst (625/628 close)", "best_of": "", "details": "72mm \u00b7 f/4.5 \u00b7 1/200s \u00b7 ISO 200 \u00b7 DSC-RX100M7A"}, {"n": 660, "group": "Birds", "note": "Pacific reef heron on the beach, profile with beak", "best_of": "", "details": "72mm \u00b7 f/4.5 \u00b7 1/200s \u00b7 ISO 800 \u00b7 DSC-RX100M7A"}, {"n": 664, "group": "Birds", "note": "Reef heron walking the shoreline", "best_of": "", "details": "72mm \u00b7 f/4.5 \u00b7 1/200s \u00b7 ISO 500 \u00b7 DSC-RX100M7A"}, {"n": 652, "group": "Birds", "note": "Reef heron standing on a rock in the surf", "best_of": "", "details": "72mm \u00b7 f/4.5 \u00b7 1/200s \u00b7 ISO 640 \u00b7 DSC-RX100M7A"}, {"n": 653, "group": "Birds", "note": "Same heron, wings spread as a wave breaks (softer, more drama)", "best_of": "", "details": "72mm \u00b7 f/4.5 \u00b7 1/200s \u00b7 ISO 640 \u00b7 DSC-RX100M7A"}, {"n": 637, "group": "Cats", "note": "Black-and-white cat asleep: whiskers pin-sharp", "best_of": "", "details": "54mm \u00b7 f/4.5 \u00b7 1/200s \u00b7 ISO 100 \u00b7 DSC-RX100M7A"}, {"n": 680, "group": "Cats", "note": "Tortoiseshell cat curled on the table", "best_of": "", "details": "35mm \u00b7 f/4.0 \u00b7 1/13s \u00b7 ISO 800 \u00b7 DSC-RX100M7A"}, {"n": 684, "group": "Cats", "note": "Tortie beside the carved eagle, sea behind (backlit, needs the raw)", "best_of": "", "details": "20mm \u00b7 f/4.0 \u00b7 1/60s \u00b7 ISO 640 \u00b7 DSC-RX100M7A"}, {"n": 694, "group": "Cats", "note": "Cat and carved eagle against the sunset", "best_of": "", "details": "9mm \u00b7 f/2.8 \u00b7 1/40s \u00b7 ISO 160 \u00b7 DSC-RX100M7A"}, {"n": 693, "group": "Landscapes", "note": "Sunset with a longtail on the sun path", "best_of": "", "details": "72mm \u00b7 f/4.5 \u00b7 1/200s \u00b7 ISO 320 \u00b7 DSC-RX100M7A"}, {"n": 640, "group": "Landscapes", "note": "Karst islands over the bay, fisherman in the shallows", "best_of": "", "details": "72mm \u00b7 f/5.6 \u00b7 1/500s \u00b7 ISO 100 \u00b7 DSC-RX100M7A"}, {"n": 645, "group": "Landscapes", "note": "Island at low tide over the red roofs", "best_of": "", "details": "9mm \u00b7 f/4.0 \u00b7 1/200s \u00b7 ISO 100 \u00b7 DSC-RX100M7A"}, {"n": 575, "group": "Landscapes", "note": "Palms bending in the wind", "best_of": "", "details": "72mm \u00b7 f/4.5 \u00b7 1/200s \u00b7 ISO 160 \u00b7 DSC-RX100M7A"}], "readonly": true};
let removed = new Set(), order = D.items.map(i => i.n), cur = -1, server = false;
const LS = 'shortlist:' + location.pathname;

async function load() {
  if (D.readonly) { document.body.classList.add('ro'); render(); return; }
  try { const r = await fetch('state', {cache: 'no-store'}); if (r.ok) { server = true; (await r.json()).removed?.forEach(n => removed.add(n)); } } catch (e) {}
  if (!server) { try { JSON.parse(localStorage.getItem(LS) || '[]').forEach(n => removed.add(n)); } catch (e) {} }
  render();
}
async function save() {
  const body = JSON.stringify({removed: [...removed]});
  if (server) { try { await fetch('state', {method: 'POST', headers: {'Content-Type': 'application/json'}, body}); } catch (e) { server = false; } }
  if (!server) { try { localStorage.setItem(LS, JSON.stringify([...removed])); } catch (e) {} }
  status();
}
function status() {
  const k = D.items.length - removed.size;
  document.getElementById('status').innerHTML = `<b>${k}</b> of ${D.items.length} selected` +
    (removed.size ? ` · removed: ${[...removed].sort((a,b)=>a-b).join(', ')}` : '') +
    (server ? ' · saved to selects.json' : ' · <span style="color:#e5484d">viewing offline: choices kept in this browser only</span>');
}
function toggle(n) { removed.has(n) ? removed.delete(n) : removed.add(n); save(); paint(n); if (cur >= 0) show(cur); }
function paint(n) {
  const a = document.getElementById('a' + n); if (!a) return;
  a.classList.toggle('removed', removed.has(n)); a.querySelector('.tog').textContent = removed.has(n) ? 'Restore' : 'Remove';
}
function render() {
  document.getElementById('t').textContent = D.title; document.getElementById('st').textContent = D.subtitle;
  const groups = {}; D.items.forEach(i => (groups[i.group] ||= []).push(i));
  const m = document.getElementById('m'); m.innerHTML = '';
  for (const [g, items] of Object.entries(groups)) {
    const h = document.createElement('h2'); h.textContent = `${g} (${items.length})`; m.appendChild(h);
    const grid = document.createElement('div'); grid.className = 'g'; m.appendChild(grid);
    for (const i of items) {
      const a = document.createElement('article'); a.id = 'a' + i.n;
      a.innerHTML = `<img src="img/${i.n}.jpg" loading="lazy" alt=""><button class="tog"></button>
        <div class="meta"><h3>${i.title || 'DSC' + String(i.n).padStart(5,'0')}</h3><p></p><small></small><div class="det"></div></div>`;
      a.querySelector('p').textContent = i.note; a.querySelector('small').textContent = i.best_of ? 'best of ' + i.best_of : '';
      a.querySelector('.det').textContent = i.details || '';
      a.querySelector('img').onclick = () => show(order.indexOf(i.n));
      a.querySelector('.tog').onclick = e => { e.stopPropagation(); toggle(i.n); };
      grid.appendChild(a); paint(i.n);
    }
  }
  if (D.left_out) { const lo = document.getElementById('lo'); lo.innerHTML = '<h2>Left out</h2><p class="sub"></p>'; lo.querySelector('p').textContent = D.left_out; }
  status();
}
const lb = document.getElementById('lb');
function show(k) {
  cur = (k + order.length) % order.length; const n = order[cur], i = D.items[cur];
  lb.classList.remove('zoom');
  document.getElementById('lbimg').src = `img/full/${n}.jpg`;
  document.getElementById('lbn').textContent = `DSC${String(n).padStart(5,'0')}  (${cur + 1}/${order.length})`;
  document.getElementById('lbnote').textContent = i.note;
  document.getElementById('lbdet').textContent = i.details || '';
  if (D.readonly) document.getElementById('keys').textContent = 'click = zoom to 100% · ← → browse · Esc close';
  const t = document.getElementById('lbtog'), r = removed.has(n);
  t.textContent = r ? 'Restore to selects' : 'Remove from selects'; t.className = r ? 'rs' : 'rm';
  lb.classList.toggle('isrm', r); lb.classList.add('on');
  const nx = new Image(); nx.src = `img/full/${order[(cur + 1) % order.length]}.jpg`;   // preload next
}
function closeLb() { lb.classList.remove('on', 'zoom'); cur = -1; }
// click the photo: zoom to 100% centred on the click point; click again to fit the screen
const lbimg = document.getElementById('lbimg');
lbimg.addEventListener('click', e => {
  if (lb.classList.contains('zoom')) { lb.classList.remove('zoom'); return; }
  const r = lbimg.getBoundingClientRect(), nw = lbimg.naturalWidth, nh = lbimg.naturalHeight;
  const s = Math.min(r.width / nw, r.height / nh), ox = (r.width - nw * s) / 2, oy = (r.height - nh * s) / 2;
  const px = (e.clientX - r.left - ox) / s, py = (e.clientY - r.top - oy) / s;   // point in image pixels
  lb.classList.add('zoom');
  lb.scrollLeft = px - innerWidth / 2; lb.scrollTop = py - innerHeight / 2;
});
document.getElementById('lbtog').onclick = () => toggle(order[cur]);
document.getElementById('lbclose').onclick = closeLb;
lb.querySelector('.prev').onclick = () => show(cur - 1);
lb.querySelector('.next').onclick = () => show(cur + 1);
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('on')) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); show(cur + 1); }
  else if (e.key === 'ArrowLeft') show(cur - 1);
  else if (e.key === 'Escape') closeLb();
  else if (!D.readonly && (e.key === 'x' || e.key === 'X' || e.key === 'Delete' || e.key === 'Backspace')) { e.preventDefault(); toggle(order[cur]); }
});
let sx = null; lb.addEventListener('touchstart', e => sx = e.touches[0].clientX);
lb.addEventListener('touchend', e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1)); sx = null; });
load();
</script>
</body>
</html>
