<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noimageindex">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>The Adventures of Rob Rob</title>
<style>
  :root{--bg:#111;--card:#1b1b1b;--fg:#eee;--mut:#9a9a9a;--acc:#f5b324;--navbg:rgba(17,17,17,.92)}

  body[data-mode=party]{--acc:#ff4fb0;--bg:#120a1c;--card:#1d1428;--navbg:rgba(18,10,28,.92)}
  body{transition:background-color .4s}
  /* Nature Boy / Party Boy switch (like a day/night switch) + show everything */
  #modes{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
  .ml{border:0;background:none;color:var(--mut);font:700 15px system-ui;cursor:pointer;padding:8px 2px;min-height:44px}
  body[data-mode=nature] #mNat,body[data-mode=party] #mPar{color:var(--fg)}
  #sw{position:relative;width:64px;height:34px;border-radius:999px;border:0;cursor:pointer;padding:0;flex:none;
      background:linear-gradient(90deg,#3f7d3a,#8a2a8f);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
  #sw::after{content:"\1F33F";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:16px;line-height:28px;text-align:center;transition:left .25s,transform .25s}
  body[data-mode=party] #sw::after{content:"\1FAA9";left:33px}
  body[data-mode=all] #sw::after{content:"";left:18px;transform:scale(.7);background:#bbb}
  #mAll{border:1px solid #444;background:transparent;color:var(--fg);border-radius:999px;padding:0 14px;min-height:36px;font:600 14px system-ui;cursor:pointer}
  body[data-mode=all] #mAll{background:var(--acc);border-color:var(--acc);color:#111}
  .empty{color:var(--mut);text-align:center;margin:60px 0;font-size:16px}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,system-ui,sans-serif;
       padding:24px max(24px,env(safe-area-inset-right)) 60px max(24px,env(safe-area-inset-left))}
  header h1{margin:0;font-size:28px}
  header p{color:var(--mut);margin:6px 0 0}
  nav{position:sticky;top:0;z-index:5;background:var(--navbg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      margin-top:18px;padding:10px 0;display:flex;gap:8px;border-bottom:1px solid #222}
  nav{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch} nav::-webkit-scrollbar{display:none}
  nav a{color:var(--fg);text-decoration:none;padding:6px 14px;border-radius:999px;background:#222;font-weight:600;font-size:14px;white-space:nowrap;flex:none}
  body{overflow-x:hidden} header p{overflow-wrap:anywhere}
  nav a.on{background:var(--acc);color:#111}
  .day{scroll-margin-top:60px}
  .day>h2{font-size:24px;margin:34px 0 2px}
  .day>.dsub{color:var(--mut);margin:0 0 6px}
  h3.grp{color:var(--acc);margin:22px 0 12px;font-size:17px}
  header,nav,main,.end{max-width:1500px;margin-left:auto;margin-right:auto}
  /* flowing masonry: photos keep their own shape; more load in as you scroll */
  .g{display:flex;gap:16px;align-items:flex-start}
  .g .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
  article{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer}
  article .ph{position:relative;background:#000}
  article img{width:100%;height:auto;display:block;opacity:0;transition:opacity .35s}
  article img.ld{opacity:1}
  article .play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  article .play span{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
  article .play span::before{content:"";border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
  article .meta{padding:10px 12px 12px}
  article p{margin:0;color:#ddd}
  article .det{color:var(--mut);font-size:12px;margin-top:4px}
  article .meta p:empty,article .meta .det:empty{display:none}
  #sentinel{height:1px}
  .end{color:var(--mut);text-align:center;margin:40px 0 0;font-size:13px}
  /* full-screen viewer */
  #lb{position:fixed;inset:0;background:#000;display:none;z-index:10;overscroll-behavior:contain}
  #lb.on{display:block}
  #lb img,#lb video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  #lb img{cursor:pointer;touch-action:manipulation}
  #lb video{display:none;background:#000}
  #lb.vid video{display:block;height:calc(100% - 120px - env(safe-area-inset-bottom))} #lb.vid img{display:none}
  #lb.vid .keys{display:none}
  #lb .bar{position:fixed;left:0;right:0;bottom:0;padding:14px max(18px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
           display:flex;gap:12px;align-items:center;background:linear-gradient(transparent,rgba(0,0,0,.85));flex-wrap:wrap}
  #lb .cap{flex:1;min-width:200px}
  #lb .cap b{font-size:15px}
  #lb .cap span{color:#ccc;margin-left:8px}
  #lb .cap small{display:block;color:#999;margin-top:2px}
  #lb button{border:0;border-radius:8px;padding:10px 14px;font:600 14px system-ui;cursor:pointer;color:#fff;background:#333}
  #lb .nav{position:absolute;top:0;bottom:90px;width:18%;cursor:pointer}
  #lb .prev{left:0} #lb .next{right:0}
  #lb.vid .nav{bottom:140px}
  .keys{color:#888;font-size:12px}
  #pickbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:6;gap:12px;align-items:center;justify-content:space-between;background:#1d1d1d;border-top:1px solid #333;
           padding:12px max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  .pick #pickbar{display:flex} .pick{padding-bottom:110px!important}
  #pickbar button{min-height:46px;border:0;border-radius:10px;padding:0 16px;font:600 15px system-ui;background:var(--acc);color:#111;cursor:pointer;flex:none}
  #pickbar button:disabled{opacity:.4}
  .pick .tog{min-height:44px;font-size:14px;padding:0 14px}
  /* easy ways out of a full-screen photo */
  #lb .top{position:fixed;z-index:3;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;justify-content:space-between;pointer-events:none}
  #lb .top button{pointer-events:auto;height:48px;border-radius:999px;background:rgba(20,20,20,.78);border:1px solid rgba(255,255,255,.22);font-size:16px;-webkit-tap-highlight-color:transparent}
  #lbback{padding:0 18px 0 14px} #lbx{width:48px;padding:0!important;font-size:26px!important;line-height:1}
  #lb .nav{top:76px}
  /* leave-the-page warning */
  #leave{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(0,0,0,.72);padding:20px}
  #leave.on{display:grid}
  #leave>div{background:#1d1d1d;border:1px solid #333;border-radius:16px;padding:22px;max-width:360px;width:100%;text-align:center}
  #leave h2{margin:0 0 6px;font-size:20px} #leave p{margin:0 0 18px;color:#bbb}
  #leave button{display:block;width:100%;min-height:50px;border:0;border-radius:12px;font:600 16px system-ui;cursor:pointer;margin-top:10px}
  #stay{background:var(--acc);color:#111} #go{background:#333;color:#fff}
  /* phone photos: snapshot look (light frame, rounded inner corners) + phone badge */
  article.phone{background:#f3efe7;padding:8px 8px 0;border-radius:14px}
  article.phone .ph{border-radius:8px;overflow:hidden}
  article.phone p{color:#222} article.phone .det{color:#6d6a63}
  article.phone .meta{padding:10px 6px 12px}
  .pbadge{position:absolute;bottom:10px;left:10px;z-index:1;display:flex;align-items:center;gap:5px;
          background:rgba(0,0,0,.6);color:#fff;font:600 11px system-ui;padding:4px 8px 4px 6px;border-radius:999px;pointer-events:none}
  .pbadge svg{width:12px;height:12px}
  /* quote notes between the photos */
  .quote{margin:34px auto;max-width:720px;padding:6px 0 6px 22px;border-left:3px solid var(--acc);font:italic 400 clamp(20px,2.6vw,27px)/1.45 Georgia,'Times New Roman',serif;color:var(--fg);white-space:pre-wrap}
  .quote::before{content:"\201C";display:block;font-size:2.2em;line-height:.6;color:var(--acc);margin-bottom:6px;font-style:normal}
  .quote.ed{white-space:normal}
  .quote textarea{display:block;width:100%;min-height:96px;resize:vertical;background:#1a1a1a;color:var(--fg);border:1px dashed #555;border-radius:10px;padding:12px;font:inherit;box-sizing:border-box}
  .quote textarea:focus{outline:none;border-color:var(--acc)}
  .quote .qdel{margin-top:8px;border:0;border-radius:8px;padding:8px 12px;font:600 13px system-ui;cursor:pointer;background:#333;color:#fff}
  .addq{display:none;border:1px dashed #666;background:transparent;color:#ccc;border-radius:8px;padding:6px 10px;font:600 13px system-ui;cursor:pointer;margin:0 12px 12px}
  .edit .addq{display:inline-block} .addq:hover{border-color:var(--acc);color:var(--fg)}
  .day>.addq{margin:0 0 10px}
  .pick .addq{min-height:44px;font-size:14px}
  /* edit mode (local only) */
  #status{display:none;color:var(--mut);font-size:13px;margin:10px 0 0}
  .edit #status{display:block} #status b{color:var(--fg)}
  .tog{display:none;position:absolute;top:10px;right:10px;z-index:2;border:0;border-radius:6px;padding:7px 11px;font:600 12px system-ui;cursor:pointer;background:rgba(0,0,0,.7);color:#fff}
  .edit .tog{display:block} .tog:hover{background:#e5484d}
  article.removed{opacity:.3} article.removed .tog{background:#3fb950}
  article.removed::after{content:"Removed";position:absolute;top:10px;left:10px;background:#e5484d;color:#fff;font:600 12px system-ui;padding:4px 8px;border-radius:4px}
  article{position:relative}
  #lbtog{display:none} .edit #lbtog{display:inline-block;background:#e5484d} .edit #lbtog.rs{background:#3fb950}

    body{padding:16px max(12px,env(safe-area-inset-right)) 40px max(12px,env(safe-area-inset-left))}
    nav{margin-top:14px;padding:8px 0}
    header h1{font-size:23px}
    .g,.g .col{gap:12px}
    .keys{display:none}
    #lb .cap span{display:block;margin:2px 0 0}
  }
  /* welcome pop-up: pick your Rob */
  #pick{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px}

  #pick>div{background:#1b1b1b;border-radius:18px;padding:24px 20px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}

  #pkrow{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px 0 22px}

  #pksw{position:relative;width:84px;height:44px;border-radius:999px;border:0;cursor:pointer;padding:0;flex:none;

  .capin{display:none;width:100%;min-height:44px;margin:6px 0 4px;resize:vertical;background:#141414;color:var(--fg);border:1px dashed #555;border-radius:8px;padding:10px;font:15px/1.35 system-ui;box-sizing:border-box}

</style>
</head>
<body>
<header><h1 id="t"></h1><p id="st"></p>
<div id="modes"><button class="ml" id="mNat">Introvert</button><button id="sw" aria-label="Switch between Introvert and Outrovert"></button><button class="ml" id="mPar">Outrovert</button><button id="mAll">The whole Rob</button></div>
<p id="status"></p></header>
<nav id="nav"></nav>
<main id="m"></main>
<div id="sentinel"></div>

<div id="lb" aria-modal="true" role="dialog">
  <img id="lbimg" alt="">
  <video id="lbvid" controls playsinline preload="metadata"></video>
  <div class="nav prev" title="Previous"></div><div class="nav next" title="Next"></div>
  <div class="top"><button id="lbback" aria-label="Back to the album">‹ Album</button><button id="lbx" aria-label="Close photo">×</button></div>
  <div class="bar">
    <div class="cap"><b id="lbn"></b><span id="lbnote"></span><small id="lbdet"></small><span id="lbhc"></span></div>
    <span class="keys">click photo = back to album · ← → browse · Esc close</span>
    <button id="lbtog"></button>
  </div>
</div>

<div id="pick" role="dialog" aria-modal="true" aria-labelledby="pkh"><div>
  <h2 id="pkh">How would you like your Rob today?</h2>
  <div id="pkrow"><button class="pl" id="pkNat">Introverted</button><button id="pksw" aria-label="Introverted or Extroverted: tap a side"></button><button class="pl" id="pkPar">Extroverted</button></div>
  <button id="pkAll">All of Rob, please</button>
</div></div>
<div id="pickbar"><span id="pickn"></span><div class="btns"><button id="pickcopy">Copy for Claude</button><button id="pickpub">Publish</button></div></div>
<div id="pub" role="dialog" aria-modal="true"><div id="pubin"></div></div>

<div id="leave" role="alertdialog" aria-modal="true" aria-labelledby="lvh"><div>
  <h2 id="lvh">Leave the album?</h2><p id="lvp">You're about to leave this page.</p>
  <button id="stay">Stay here</button><button id="go">Leave</button>
</div></div>

lb.querySelector('.prev').onclick = () => show(cur - 1);
lb.querySelector('.next').onclick = () => show(cur + 1);
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('on')) return;
  if (editing && (e.key === 'x' || e.key === 'X')) { toggle(all[cur].id); return; }
  if (e.key === 'ArrowRight') show(cur + 1); else if (e.key === 'ArrowLeft') show(cur - 1); else if (e.key === 'Escape') closeLb();
});
let sx = null, sy = null, moved = false;
const pinched = () => window.visualViewport && visualViewport.scale > 1.02;
lb.addEventListener('touchstart', e => {
  moved = false;
  if (e.touches.length > 1 || pinched() || e.target.closest('button,video')) { sx = null; return; }
  sx = e.touches[0].clientX; sy = e.touches[0].clientY; lbimg.style.transition = '';
}, {passive: true});
lb.addEventListener('touchmove', e => {
  if (sx === null) return;
  if (e.touches.length > 1) { sx = null; lbimg.style.transform = ''; return; }
  const dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
  if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
  if (e.cancelable) e.preventDefault();
  lbimg.style.transform = Math.abs(dx) > Math.abs(dy) ? `translateX(${dx}px)` : `translateY(${dy}px)`;
}, {passive: false});
function endSwipe(e) {
  if (sx === null) return;
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; sx = null; lbimg.style.transform = '';
  if (e.type === 'touchcancel') return;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) show(cur + (dx < 0 ? 1 : -1));
  else if (Math.abs(dy) > 60 && Math.abs(dy) > Math.abs(dx)) closeLb();   // swipe down or up closes
}
lb.addEventListener('touchend', endSwipe); lb.addEventListener('touchcancel', endSwipe);
</script>
